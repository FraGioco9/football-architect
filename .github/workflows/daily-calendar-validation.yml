name: Daily calendar validation
# rerun after before-day checkpoint support

on:
  push:
    branches:
      - ux/fixed-controls-dropdowns
    paths:
      - .github/workflows/daily-calendar-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax
        shell: pwsh
        run: |
          Get-ChildItem ./src -Recurse -Include *.js,*.mjs | ForEach-Object { node --check $_.FullName }
          node --check ./server.mjs
      - name: Domain calendar gate
        shell: pwsh
        run: |
          @'
          import {makeWorld} from './src/data.js';
          import {startCareer,advanceDay,newSeason} from './src/domain/career.js';
          import {enableAdvancedCareer} from './src/domain/advanced-career.js';
          import {enableCareerTraining} from './src/domain/career-training.js';
          import {enableCareerWorld} from './src/domain/career-world.js';
          import {enableCareerMarket} from './src/domain/career-market.js';
          import {enableCareerCalendar} from './src/domain/career-calendar.js';
          import {enableCareerScouting,assignScoutingMission} from './src/domain/career-scouting.js';
          import {validateSave} from './src/domain/save-validation.js';
          import {addDaysISO,isCareerDate} from './src/domain/career-date.js';

          const ok=(v,m,d={})=>{if(!v)throw new Error(m+' '+JSON.stringify(d));};

          {
            const w=makeWorld(260126,'IT');
            startCareer(w,1,'Daily Basic');
            ok(isCareerDate(w.currentDate),'missing currentDate');
            ok(w.fixtures.every((r,i)=>isCareerDate(r.date)&&r.matches.every(m=>m.date===r.date)),'fixture dates missing');
            const start=w.currentDate,first=w.fixtures[0].date;
            let clicks=0;
            while(w.round===0&&clicks<14){
              const before=w.currentDate;
              const result=advanceDay(w);
              clicks++;
              ok(w.currentDate===addDaysISO(before,1),'continue did not advance one date',{before,after:w.currentDate});
              if(w.currentDate<first)ok(w.round===0&&!result.match,'match played too early',{date:w.currentDate,first});
            }
            ok(w.currentDate===first,'first match not reached on scheduled date',{date:w.currentDate,first});
            ok(w.round===1&&w.fixtures[0].matches.every(m=>m.result),'matchday not simulated on its date');
            ok(w.careerDay===clicks,'careerDay mismatch',{careerDay:w.careerDay,clicks});
            ok(validateSave(w),'dated basic save invalid');
          }

          {
            const w=makeWorld(260127,'IT');
            startCareer(w,1,'Daily Advanced');
            enableAdvancedCareer(w);
            enableCareerTraining(w);
            const start=w.currentDate;
            for(let i=0;i<7;i++){
              const before=w.currentDate;
              advanceDay(w);
              ok(w.currentDate===addDaysISO(before,1),'advanced date skipped',{i,before,after:w.currentDate});
              ok(w.advancedV1.clockDay===w.careerDay,'advanced clock desync',{i,clock:w.advancedV1.clockDay,careerDay:w.careerDay});
              ok(w.players.every(p=>p.medicalV1.lastDay===w.advancedV1.clockDay),'medical clock desync',{i});
            }
            ok(w.currentDate===addDaysISO(start,7),'advanced seven-day date mismatch');
            ok(w.advancedV1.trainingV1.lastDay===7,'training did not process daily');
            ok(w.advancedV1.trainingV1.reports.length===1,'weekly training report missing');
            ok(w.round===1,'advanced first fixture not played on day 7');
            ok(validateSave(w),'dated advanced save invalid');
          }

          {
            const w=makeWorld(260128,'IT');
            startCareer(w,1,'Rollover');
            let guard=0;
            while(w.round<w.fixtures.length&&guard<400){advanceDay(w);guard++;}
            ok(w.round===38,'season did not finish',{round:w.round,guard});
            const finalDate=w.currentDate;
            const oldSeason=w.season;
            newSeason(w);
            ok(w.season===oldSeason+1&&w.round===0,'season rollover failed');
            ok(w.seasonStartDate===addDaysISO(finalDate,21),'new season start date did not include offseason',{finalDate,seasonStart:w.seasonStartDate});
            ok(w.fixtures[0].date===addDaysISO(finalDate,28),'new season first fixture date wrong',{first:w.fixtures[0].date,finalDate});
            ok(validateSave(w),'new season dated save invalid');
          }


          {
            const w=makeWorld(260130,'IT');
            startCareer(w,1,'Advanced Rollover');
            enableAdvancedCareer(w);
            for(let guard=0;w.round<w.fixtures.length&&guard<400;guard++)advanceDay(w);
            const finalDate=w.currentDate,finalDay=w.careerDay,finalClock=w.advancedV1.clockDay;
            newSeason(w);
            ok(w.currentDate===addDaysISO(finalDate,21),'advanced offseason real date mismatch',{finalDate,currentDate:w.currentDate});
            ok(w.careerDay===finalDay+21,'advanced offseason careerDay mismatch',{finalDay,careerDay:w.careerDay});
            ok(w.advancedV1.clockDay===finalClock+21&&w.advancedV1.clockDay===w.careerDay,'advanced offseason clock mismatch',{clock:w.advancedV1.clockDay,careerDay:w.careerDay});
            ok(w.fixtures[0].date===addDaysISO(finalDate,28),'advanced next fixture date wrong',{first:w.fixtures[0].date});
            ok(validateSave(w),'advanced rollover dated save invalid');
          }

          {
            const w=makeWorld(260129,'IT');
            startCareer(w,1,'Weekly Systems');
            enableAdvancedCareer(w);
            enableCareerWorld(w);
            enableCareerMarket(w);
            enableCareerCalendar(w);
            enableCareerScouting(w);
            assignScoutingMission(w,{revision:w.advancedV1.scoutingV1.revision,countryId:'ENG',position:'ALL',ageMin:16,ageMax:38,contractMax:12,weeks:4});
            for(let i=0;i<6;i++)advanceDay(w);
            ok(w.advancedV1.scoutingV1.missions[0].progress===0,'scouting progressed before a full week');
            advanceDay(w);
            ok(w.round===1,'weekly systems test did not reach matchday');
            ok(w.advancedV1.scoutingV1.missions[0].progress===1,'scouting weekly cadence was lost',{mission:w.advancedV1.scoutingV1.missions[0]});
            ok(w.advancedV1.scoutingV1.lastDay===7,'scouting lastDay wrong',{lastDay:w.advancedV1.scoutingV1.lastDay});
            ok(validateSave(w),'weekly systems dated save invalid');
          }

          console.log('DAILY_CALENDAR_PASS');
          '@ | Set-Content ./.daily-calendar-test.mjs -Encoding utf8
          node ./.daily-calendar-test.mjs
          Remove-Item ./.daily-calendar-test.mjs -Force

      - name: Install browser harness
        shell: pwsh
        run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - name: Browser continue gate
        shell: pwsh
        run: |
          @'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';

          const exe=['C:/Program Files/Google/Chrome/Application/chrome.exe','C:/Program Files (x86)/Google/Chrome/Application/chrome.exe'].find(p=>fs.existsSync(p));
          if(!exe)throw new Error('Chrome unavailable');
          const profile=await fsp.mkdtemp(path.join(os.tmpdir(),'fa-daily-ui-'));
          const context=await chromium.launchPersistentContext(profile,{executablePath:exe,headless:true,viewport:{width:1440,height:900}});
          const page=context.pages()[0]||await context.newPage();
          await page.goto('http://127.0.0.1:2000',{waitUntil:'domcontentloaded'});
          await page.locator('.fa-main-menu').waitFor({state:'visible',timeout:15000});
          await page.locator('[data-action="menu-new"]').click();
          await page.locator('#manager-name').fill('Daily UI');
          await page.locator('[data-action="start-career"]').click();
          await page.locator('.dashboard-hero').waitFor({state:'visible',timeout:15000});
          const before=await page.locator('.top-round').getAttribute('data-current-date');
          const errors=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(String(e)));
          await page.locator('.continue-top').click();
          await page.waitForTimeout(2500);
          const after=await page.locator('.top-round').getAttribute('data-current-date');
          if(after===before){const text=(await page.locator('body').innerText()).slice(-2500);throw new Error('Continue did not change date '+JSON.stringify({before,after,errors,text}));}
          const add=(value,n)=>{const [y,m,d]=value.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);};
          if(after!==add(before,1))throw new Error(`Continue skipped date: ${before} -> ${after}`);
          if(await page.locator('.fa-main-menu').count())throw new Error('Returned to main menu after Continue');
          console.log('DAILY_UI_PASS '+JSON.stringify({before,after}));
          await context.close();
          '@ | Set-Content ./.daily-ui-test.mjs -Encoding utf8
          $p=Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory "$PWD" -PassThru
          for($i=0;$i -lt 60;$i++){try{$r=Invoke-WebRequest http://127.0.0.1:2000 -UseBasicParsing -TimeoutSec 2;if($r.StatusCode -eq 200){break}}catch{};Start-Sleep 1}
          try{node ./.daily-ui-test.mjs}finally{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Remove-Item ./.daily-ui-test.mjs -Force
