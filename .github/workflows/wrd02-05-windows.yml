name: WRD02.05 Windows IndexedDB certification

on:
  push:
    branches:
      - wrd/wrd02-05-windows-cert
      - wrd/wrd02-05-consolidation
    paths:
      - wrd02-05-ready.flag
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_ZIP_SHA256: 686f3abaea01807b04d1811da093f6b017eb372f1abb57e6788e6d52bc78d74c
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  wrd02-05:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruct immutable 2.0.0 ZIP
        shell: pwsh
        run: |
          $parts = Get-ChildItem ./release-b64/zip-*.part | Sort-Object Name
          if ($parts.Count -ne 12) { throw "Expected 12 release chunks, found $($parts.Count)" }
          $builder = New-Object System.Text.StringBuilder
          foreach ($part in $parts) {
            [void]$builder.Append((Get-Content $part.FullName -Raw))
          }
          $bytes = [Convert]::FromBase64String($builder.ToString())
          [IO.File]::WriteAllBytes("./Football-Architect-2.0.0-UX-STABILE-ESSENZIALE.zip", $bytes)

      - name: Verify immutable ZIP
        shell: pwsh
        run: |
          $actual=(Get-FileHash ./Football-Architect-2.0.0-UX-STABILE-ESSENZIALE.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:EXPECTED_ZIP_SHA256) { throw "Unexpected release SHA256: $actual" }

      - name: Extract isolated copy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          Expand-Archive -LiteralPath ./Football-Architect-2.0.0-UX-STABILE-ESSENZIALE.zip -DestinationPath ./work -Force

      - name: Capture primary storage contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wrd02-05-artifacts | Out-Null
          Get-Content ./work/football-architect/src/primary-career-storage.js -Raw |
            Out-File -Encoding utf8 ./wrd02-05-artifacts/primary-career-storage.js.txt
          Select-String -Path ./work/football-architect/src/main.js -Pattern 'primary\\.' -Context 3,6 |
            Out-String -Width 500 |
            Out-File -Encoding utf8 ./wrd02-05-artifacts/main-primary-usage.txt

      - name: Install test-only dependencies
        working-directory: wrd02-05-runner
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Start Football Architect local server
        shell: pwsh
        run: |
          $p=Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory "$PWD\work\football-architect" -PassThru
          $p.Id | Out-File -Encoding ascii ./server.pid
          for($i=0;$i -lt 60;$i++) {
            try {
              $r=Invoke-WebRequest http://127.0.0.1:2000 -UseBasicParsing -TimeoutSec 2
              if($r.StatusCode -eq 200){ exit 0 }
            } catch {}
            Start-Sleep -Seconds 1
          }
          throw 'Football Architect server did not become ready.'

      - name: Run WRD02.05 certification
        continue-on-error: true
        timeout-minutes: 18
        working-directory: wrd02-05-runner
        shell: pwsh
        env:
          FA_BASE_URL: http://127.0.0.1:2000
          FA_ARTIFACT_DIR: ${{ github.workspace }}\wrd02-05-artifacts
        run: npm run certify

      - name: Verify reconstructed ZIP unchanged
        if: always()
        shell: pwsh
        run: |
          $actual=(Get-FileHash ./Football-Architect-2.0.0-UX-STABILE-ESSENZIALE.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:EXPECTED_ZIP_SHA256) { throw "Release ZIP changed: $actual" }

      - name: Stop server
        if: always()
        shell: pwsh
        run: |
          if(Test-Path ./server.pid) {
            $pidValue=[int](Get-Content ./server.pid)
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          }

      - name: Upload WRD02.05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrd02-05-windows-indexeddb-evidence
          path: wrd02-05-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Gate WRD02.05 certification
        if: always()
        shell: pwsh
        run: |
          $resultPath = "./wrd02-05-artifacts/WRD02-05-WINDOWS-INDEXEDDB.json"
          if (-not (Test-Path $resultPath)) { throw "WRD02.05 evidence missing" }
          $data = Get-Content $resultPath -Raw | ConvertFrom-Json
          $state = $data.checks.WRD0205.state
          Write-Host "WRD02.05=$state"
          if ($state -ne 'PASS') { throw "WRD02.05 certification failed" }
