name: CI Exact Head

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: validate-exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          find src -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Test personality v2 domain and player generation
        run: node --test tests/plyr-06-1-personality-v2.test.mjs

      - name: Smoke test local HTTP routes
        run: |
          node server.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:2000/ -o /dev/null 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/player/1)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/not-a-real-route)" = 404
