name: Minimal CI Exact Head

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: validate-exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          node --check server.mjs
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Verify minimal three-screen simulation
        run: node --test tests/minimal-core.test.mjs
      - name: Verify multi-career IndexedDB and menu regression
        run: node --test tests/career-menu.test.mjs

      - name: Verify HTTP routes and no match pages
        run: |
          node server.mjs &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:2000/ -o /dev/null 2>/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/new-career)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/new-career/country)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/new-career/league)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/new-career/team)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/careers)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/settings)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/simulation)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/src/main.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/src/simulation.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/src/career-store.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/src/ui-pages.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/match/1)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/src/domain/career.js)" = 404
