name: BR-4 one-shot canonical generation
on:
  push:
    branches:
      - assets/br-4-laranjeiras-crest-20261124
    paths:
      - .github/workflows/br4-crest-one-shot.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'FraGioco9/football-architect'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify source revision and scope
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f assets/clubs/BR/4/crest.svg
          git status --porcelain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authoritative page generator
        run: node tools/generate-app-pages.mjs
      - name: Verify generated sources
        run: |
          set -euo pipefail
          node tools/generate-app-pages.mjs --check
          node --test tests/club-crests.test.mjs tests/club-pages.test.mjs
          git diff --check
      - name: Review scope and commit only generated artifacts; remove temporary workflow
        env:
          TARGET_BRANCH: assets/br-4-laranjeiras-crest-20261124
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --name-only | tee /tmp/br4-changed.txt
          if [ ! -s /tmp/br4-changed.txt ]; then
            echo "::error::No canonical outputs changed; manual review needed"
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              clubs/_shared/manifest.json|competitions/_shared/manifest.json|competitions/_shared/compact.json|assets/match-public-context.mjs|matches/_shared/index.html) ;;
              *) echo "::error::Unexpected generated file: $path"; exit 1 ;;
            esac
          done < /tmp/br4-changed.txt
          git add --pathspec-from-file=/tmp/br4-changed.txt
          git rm .github/workflows/br4-crest-one-shot.yml
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(branding): generate published BR-4 crest assets"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
