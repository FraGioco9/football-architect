name: Admin World foundation checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/admin-world-checks.yml'

permissions:
  contents: read

jobs:
  password-policy:
    name: Admin foundation contracts (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test password and world contracts (no remote services)
        run: node --experimental-strip-types --test backend/tests/password-policy.test.ts backend/tests/world-contract.test.ts backend/tests/world-repository.test.ts backend/tests/http-public.test.ts backend/tests/command-contract.test.ts backend/tests/origin-policy.test.ts backend/tests/email-identity.test.ts backend/tests/session-tokens.test.ts backend/tests/session-policy.test.ts backend/tests/session-repository.test.ts
      - name: Verify D1-compatible SQLite migration locally
        run: python3 -m unittest discover -s backend/tests -p 'test_world_migration.py' -v
      - name: Install pinned Worker toolchain without remote credentials
        run: |
          npm install -g npm@11.6.2 --no-audit --no-fund
          npm --prefix backend ci --no-audit --no-fund
      - name: Typecheck backend with pinned TypeScript
        run: npm --prefix backend run typecheck
      - name: Execute smoke tests in actual local Worker runtime
        run: npm --prefix backend test
