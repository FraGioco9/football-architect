name: Admin World foundation checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'backend/**'
      - 'assets/admin-settings.*'
      - 'assets/authoritative-*'
      - 'assets/competition-page.js'
      - 'assets/competition-fixtures.js'
      - 'assets/competition-tabs.js'
      - 'assets/calendar-simplified.js'
      - 'assets/world-calendar.js'
      - 'calendar/index.html'
      - 'tools/render-admin-settings.mjs'
      - 'tools/dev-admin-api-proxy.mjs'
      - 'tools/dev-standings-preview.mjs'
      - 'tools/generate-app-pages.mjs'
      - 'settings/index.html'
      - 'tests/admin-settings*'
      - 'tests/admin-world-lifecycle-browser.mjs'
      - 'tests/season-two-*'
      - 'tests/authoritative-*'
      - 'tests/backend-test-discovery.test.mjs'
      - 'tests/admin-public-preview.test.mjs'
      - 'tests/dev-admin-api-proxy.test.mjs'
      - '.github/workflows/admin-world-checks.yml'

concurrency:
  group: admin-world-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  password-policy:
    name: Admin foundation contracts (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current Admin and public JavaScript syntax before expensive tests
        run: |
          node --check assets/admin-settings.js
          node --check assets/authoritative-season.mjs
          node --check assets/authoritative-calendar.mjs
          node --check assets/authoritative-history.mjs
          node --check tests/admin-settings-browser.mjs
          node --check tests/admin-world-lifecycle-browser.mjs
          node --check tests/season-two-navigation-browser.mjs
      - name: Install pinned Worker toolchain without remote credentials
        run: |
          npm install -g npm@11.6.2 --no-audit --no-fund
          npm --prefix backend ci --no-audit --no-fund
      - name: Test password and world contracts (no remote services)
        run: npm --prefix backend run test:contracts
      - name: Verify D1-compatible SQLite migration locally
        run: python3 -m unittest discover -s backend/tests -p 'test_*migration.py' -v
      - name: Typecheck backend with pinned TypeScript
        run: npm --prefix backend run typecheck
      - name: PLAYER-AUTH-01 local Worker D1 security and Admin migration acceptance
        run: npm --prefix backend run test:auth-local
      - name: Install isolated browser tooling for PLAYER-AUTH-01 safe returns
        run: |
          npm install --prefix "$RUNNER_TEMP/fa-player-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/fa-player-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify safe post-login return routes in Chromium
        run: FA_PLAYER_PLAYWRIGHT="$RUNNER_TEMP/fa-player-browser/node_modules/playwright/index.mjs" node tests/player-safe-return-browser.mjs
      - name: Verify account style, language, app entry and registration in Chromium
        run: FA_ACCOUNT_PLAYWRIGHT="$RUNNER_TEMP/fa-player-browser/node_modules/playwright/index.mjs" node tests/account-pages-browser.mjs
      # Explicit final-gate opt-in while the PR stays Draft/HOLD; ordinary draft pushes stay light.
      - name: Execute ADMIN-WORLD-02 archive/close and historical Worker D1 regressions
        if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.body, '<!-- admin-world-final-verification -->') }}
        run: cd backend && npx vitest run tests/admin-end-season-transition-runtime.test.ts tests/season-two-activation-runtime.test.ts tests/season-two-persistence-runtime.test.ts
      - name: Execute smoke tests in actual local Worker runtime
        if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.body, '<!-- admin-world-final-verification -->') }}
        run: npm --prefix backend test
      - name: Verify operator bootstrap, recovery and local persistence across restart
        if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.body, '<!-- admin-world-final-verification -->') }}
        run: npm --prefix backend run test:operator
      - name: Install isolated pinned Chromium test tooling
        if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.body, '<!-- admin-world-final-verification -->') }}
        run: |
          npm install --prefix "$RUNNER_TEMP/fa-admin-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/fa-admin-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify Settings and two-season lifecycle with real loopback Worker and D1
        timeout-minutes: 20
        if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.body, '<!-- admin-world-final-verification -->') }}
        run: FA_ADMIN_PLAYWRIGHT="$RUNNER_TEMP/fa-admin-browser/node_modules/playwright/index.mjs" node --experimental-strip-types tests/admin-settings-browser.mjs
