name: UX controls validation

on:
  push:
    branches:
      - ux/fixed-controls-dropdowns
    paths:
      - .github/workflows/ux-controls-validation.yml

permissions:
  contents: write

env:
  BASELINE_SHA256: 4e7b354176f4633958b3f0e7c525fddd057294dc3cbc3a5027bbcf87a5de518e

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/fixed-controls-dropdowns

      - name: Reconstruct current certified candidate
        shell: pwsh
        run: |
          $parts=Get-ChildItem ./release-b64/zip-*.part | Sort-Object Name
          $builder=New-Object System.Text.StringBuilder
          foreach($part in $parts){[void]$builder.Append((Get-Content $part.FullName -Raw))}
          [IO.File]::WriteAllBytes("./baseline.zip",[Convert]::FromBase64String($builder.ToString()))
          $actual=(Get-FileHash ./baseline.zip -Algorithm SHA256).Hash.ToLower()
          if($actual -ne $env:BASELINE_SHA256){throw "Unexpected baseline hash: $actual"}
          New-Item -ItemType Directory -Force ./work | Out-Null
          Expand-Archive ./baseline.zip ./work -Force

      - name: Apply UX controls patch
        shell: pwsh
        run: |
          function Expand-GzipBase64([string]$value,[string]$dest){
            $bytes=[Convert]::FromBase64String($value)
            $input=New-Object IO.MemoryStream(,$bytes)
            $gzip=New-Object IO.Compression.GzipStream($input,[IO.Compression.CompressionMode]::Decompress)
            $output=[IO.File]::Create($dest)
            try{$gzip.CopyTo($output)}finally{$output.Dispose();$gzip.Dispose();$input.Dispose()}
          }
          Expand-GzipBase64 $env:JS_GZ_B64 "./work/football-architect/src/controls-system.js"
          Expand-GzipBase64 $env:CSS_GZ_B64 "./work/football-architect/src/controls-system.css"
          node --check ./work/football-architect/src/controls-system.js
          node --check ./work/football-architect/src/main.js

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser test dependencies
        working-directory: rst01-runner
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Write targeted browser test
        shell: pwsh
        run: |
          $test=@'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';

          const baseURL='http://127.0.0.1:2000';
          const candidates={
            chrome:['C:/Program Files/Google/Chrome/Application/chrome.exe','C:/Program Files (x86)/Google/Chrome/Application/chrome.exe'],
            edge:['C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe','C:/Program Files/Microsoft/Edge/Application/msedge.exe']
          };
          const exe=name=>candidates[name].find(p=>fs.existsSync(p));
          const assert=(ok,msg,data={})=>{if(!ok)throw new Error(msg+' '+JSON.stringify(data));};
          const box=async loc=>{const b=await loc.boundingBox();return {w:Math.round(b?.width||0),h:Math.round(b?.height||0)};};

          async function chooseLanguage(page,label){
            const trigger=page.locator('.language-switch .fa-select-trigger').first();
            await trigger.waitFor({state:'visible',timeout:10000});
            await trigger.click();
            const menu=page.locator('.fa-select-menu:not([hidden])');
            await menu.waitFor({state:'visible',timeout:5000});
            const style=await menu.evaluate(el=>({bg:getComputedStyle(el).backgroundColor,radius:getComputedStyle(el).borderRadius}));
            assert(style.bg!=='rgba(0, 0, 0, 0)'&&style.bg!=='transparent','custom dropdown surface is transparent',style);
            assert(parseFloat(style.radius)>0,'custom dropdown has no themed radius',style);
            await menu.locator('.fa-select-option',{hasText:label}).click();
          }

          async function run(browserName){
            const executablePath=exe(browserName);assert(executablePath, browserName+' unavailable');
            const userData=await fsp.mkdtemp(path.join(os.tmpdir(),'fa-ux-controls-'+browserName+'-'));
            const context=await chromium.launchPersistentContext(userData,{executablePath,headless:true,viewport:{width:1280,height:900},args:['--no-first-run','--no-default-browser-check']});
            try{
              const page=context.pages()[0]||await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e?.message||e)));
              page.on('console',m=>{if(m.type()==='error'&&!/Failed to load resource: the server responded with a status of 404/i.test(m.text()))errors.push(m.text());});
              await page.goto(baseURL,{waitUntil:'domcontentloaded'});
              try{
                await page.locator('.fa-main-menu').waitFor({state:'visible',timeout:15000});
              }catch(error){
                const diagnostic=await page.evaluate(()=>({
                  title:document.title,
                  readyState:document.readyState,
                  bodyText:(document.body?.innerText||'').slice(0,4000),
                  bodyHtml:(document.body?.innerHTML||'').slice(0,8000),
                  appHtml:(document.querySelector('#app')?.innerHTML||'').slice(0,8000)
                })).catch(e=>({evaluateError:String(e?.message||e)}));
                console.log('BOOT_DIAGNOSTIC '+JSON.stringify({browser:browserName,errors,diagnostic}));
                throw error;
              }

              const native=page.locator('.language-switch select').first();
              const custom=page.locator('.language-switch .fa-select-trigger').first();
              assert(await native.getAttribute('aria-hidden')==='true','native select was not progressively hidden');
              assert(await custom.getAttribute('role')==='combobox','custom select trigger lacks combobox role');

              await chooseLanguage(page,'English');
              await page.locator('.fa-menu-main').waitFor({state:'visible'});
              assert(await page.locator('.language-switch select').first().inputValue()==='en','custom dropdown did not update native select');

              await page.locator('[data-action="menu-new"]').click();
              await page.locator('.onboarding').waitFor({state:'visible'});
              const homeEn=await box(page.locator('[data-action="menu-home"]').first());
              const careersEn=await box(page.locator('[data-action="open-careers"]').first());

              await chooseLanguage(page,'Italiano');
              await page.locator('.onboarding').waitFor({state:'visible'});
              const homeIt=await box(page.locator('[data-action="menu-home"]').first());
              const careersIt=await box(page.locator('[data-action="open-careers"]').first());
              assert(homeEn.w===homeIt.w&&homeEn.h===homeIt.h,'menu-home changes size across languages',{homeEn,homeIt});
              assert(careersEn.w===careersIt.w&&careersEn.h===careersIt.h,'open-careers changes size across languages',{careersEn,careersIt});
              assert(homeIt.w===168&&homeIt.h===40,'desktop text-button geometry is not fixed',{homeIt});

              const track=await page.evaluate(()=>getComputedStyle(document.documentElement,'::-webkit-scrollbar-track').backgroundColor);
              assert(track==='rgba(0, 0, 0, 0)'||track==='transparent','scrollbar track is visible',{track});

              const trigger=page.locator('.language-switch .fa-select-trigger').first();
              await trigger.focus();await trigger.press('Enter');
              assert(await page.locator('.fa-select-menu:not([hidden])').isVisible(),'keyboard did not open custom dropdown');
              await page.keyboard.press('Escape');
              assert(!(await page.locator('.fa-select-menu:not([hidden])').count()),'Escape did not close custom dropdown');

              await page.setViewportSize({width:390,height:844});
              const geom=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
              assert(geom.sw<=geom.cw+1,'fixed controls caused horizontal page overflow on mobile',geom);
              await page.setViewportSize({width:1280,height:900});

              const input=page.locator('#manager-name');await input.fill('UX Controls Test');
              await page.locator('[data-action="start-career"]').click();
              await page.locator('.dashboard-hero').waitFor({state:'visible',timeout:10000});
              const counts=await page.evaluate(()=>({
                eligible:[...document.querySelectorAll('select')].filter(s=>!s.multiple&&Number(s.size)<=1).length,
                wrapped:document.querySelectorAll('.fa-custom-select > select').length
              }));
              assert(counts.eligible===counts.wrapped,'not all single-select controls were enhanced',counts);
              assert(errors.length===0,'browser errors detected',{errors});
              console.log(JSON.stringify({browser:browserName,state:'PASS',homeEn,homeIt,careersEn,careersIt,track,counts}));
            } finally { await context.close().catch(()=>{}); }
          }
          for(const name of ['chrome','edge'])await run(name);
          '@
          Set-Content ./rst01-runner/.ux-controls-targeted.mjs -Value $test -NoNewline -Encoding utf8

      - name: Gate Chrome and Edge on Node 20
        shell: pwsh
        run: |
          $p=Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory "$PWD\work\football-architect" -PassThru
          for($i=0;$i -lt 60;$i++){try{$r=Invoke-WebRequest http://127.0.0.1:2000 -UseBasicParsing -TimeoutSec 2;if($r.StatusCode -eq 200){break}}catch{};Start-Sleep 1}
          try{node ./rst01-runner/.ux-controls-targeted.mjs}finally{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Gate Chrome and Edge on Node 24
        shell: pwsh
        run: |
          $p=Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory "$PWD\work\football-architect" -PassThru
          for($i=0;$i -lt 60;$i++){try{$r=Invoke-WebRequest http://127.0.0.1:2000 -UseBasicParsing -TimeoutSec 2;if($r.StatusCode -eq 200){break}}catch{};Start-Sleep 1}
          try{node ./rst01-runner/.ux-controls-targeted.mjs}finally{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}

      - name: Build candidate package
        id: package
        shell: pwsh
        run: |
          tar.exe -a -c -f ./candidate.zip -C ./work football-architect
          $hash=(Get-FileHash ./candidate.zip -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" | Out-File $env:GITHUB_OUTPUT -Append
          Remove-Item ./release-b64/zip-*.part -Force
          $b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes("./candidate.zip"))
          $index=0
          for($offset=0;$offset -lt $b64.Length;$offset+=60000){
            $len=[Math]::Min(60000,$b64.Length-$offset)
            Set-Content ("./release-b64/zip-{0:d3}.part" -f $index) $b64.Substring($offset,$len) -NoNewline -Encoding ascii
            $index++
          }
          $builder=New-Object System.Text.StringBuilder
          Get-ChildItem ./release-b64/zip-*.part | Sort-Object Name | ForEach-Object {[void]$builder.Append((Get-Content $_.FullName -Raw))}
          [IO.File]::WriteAllBytes("./roundtrip.zip",[Convert]::FromBase64String($builder.ToString()))
          $round=(Get-FileHash ./roundtrip.zip -Algorithm SHA256).Hash.ToLower()
          if($round -ne $hash){throw "release-b64 roundtrip mismatch"}

      - name: Document and commit tested candidate
        shell: pwsh
        env:
          NEW_HASH: ${{ steps.package.outputs.hash }}
        run: |
          New-Item -ItemType Directory -Force ./docs/ux-controls | Out-Null
          $doc=@"
          # UX controls polish

          - Text buttons use content-independent dimensions so IT/EN changes do not resize them.
          - Existing full-width and icon-only controls retain their intended geometry.
          - Scrollbar tracks and corners are transparent; thumbs remain visible.
          - Single-select dropdowns use a Football Architect themed combobox/listbox surface while keeping the native select synchronized as the game state source.
          - Keyboard open/close, selection change, responsive overflow and B-PC03 career creation are covered by the targeted browser gate.

          Targeted gate: Chrome + Edge on Node 20 and Node 24 — PASS.
          Candidate SHA-256: `$env:NEW_HASH`
          No deploy.
          "@
          Set-Content ./docs/ux-controls/README.md -Value $doc -Encoding utf8
          Remove-Item ./rst01-runner/.ux-controls-targeted.mjs -Force
          git config user.name "FraGioco9"
          git config user.email "giocolifrancesco@gmail.com"
          git add release-b64 docs/ux-controls/README.md
          git commit -m "UX: stabilize buttons and theme dropdown controls"
          git push origin HEAD:ux/fixed-controls-dropdowns
