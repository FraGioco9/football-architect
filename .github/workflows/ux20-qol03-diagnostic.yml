name: UX20 00A qol03 shortcut diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install browser
        working-directory: ux20-qol03-diagnostic
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          node server.mjs > /tmp/fa.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:2000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/fa.log
          exit 1
      - name: Inspect DOM
        working-directory: ux20-qol03-diagnostic
        run: node run.mjs
