name: CI-OPT-03 FULL evidence gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
        type: string
      expected_head:
        description: Exact 40-digit PR HEAD SHA
        required: true
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: ci-opt-03-full-evidence-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  full-evidence:
    name: CI FULL exact-head evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify exact PR head and complete FULL workflow evidence
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_head }}
        with:
          script: |
            const prNumber=Number(process.env.PR_NUMBER);
            const expected=process.env.EXPECTED_HEAD;
            if (!Number.isSafeInteger(prNumber)||prNumber<1||!/^[0-9a-f]{40}$/.test(expected)) {
              core.setFailed('Invalid PR number or expected SHA');return;
            }
            const {owner,repo}=context.repo;
            const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:prNumber});
            if(pr.state!=='open'||pr.head.repo.full_name!==owner+'/'+repo||pr.head.sha!==expected) {
              core.setFailed('PR closed, foreign head, or stale HEAD');return;
            }
            if(pr.base.ref!=='main'){core.setFailed('Unexpected target branch');return;}
            const changed=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:prNumber,per_page:100});
            if(changed.length>=3000){core.setFailed('PR diff too large to trust; manual audit required');return;}
            const needsAdmin=changed.some(f=>/^(?:backend\/|account\/|assets\/(?:account-|profile-|admin-settings|authoritative-)|tools\/(?:dev-admin-|shared-nonproduction-|render-admin-)|\.github\/workflows\/admin-world-checks\.yml)/.test(f.filename));
            const required=['landing-checks.yml','int24-browser-qa.yml'];
            if(needsAdmin)required.push('admin-world-checks.yml');
            const evidence=[];
            for(const workflow_id of required){
              let selected;
              for(let attempt=0;attempt<80;attempt++){
                const {data}=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id,head_sha:expected,per_page:100});
                const matches=data.workflow_runs.filter(run=>run.head_sha===expected&&['pull_request','workflow_dispatch'].includes(run.event)&&run.run_attempt>=1);
                selected=matches.sort((a,b)=>b.id-a.id)[0];
                if(selected?.status==='completed')break;
                if(attempt===79){core.setFailed('Timed out waiting for FULL workflow '+workflow_id+' on '+expected);return;}
                await new Promise(resolve=>setTimeout(resolve,15000));
              }
              if(selected.conclusion!=='success'){
                core.setFailed('Latest FULL workflow is not a completed PASS: '+workflow_id+' '+selected.html_url);return;
              }
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:selected.id,per_page:100});
              const successfulJobs=jobs.filter(j=>j.conclusion==='success');
              const names=successfulJobs.map(j=>j.name);
              const expectedJob=workflow_id==='landing-checks.yml'?'landing':workflow_id==='int24-browser-qa.yml'?'chromium':'Final local operator persistence, restart and browser lifecycle';
              if(!names.some(n=>n===expectedJob||n.endsWith(' / '+expectedJob))){
                core.setFailed('Missing completed FULL job '+expectedJob+' in '+workflow_id);return;
              }
              if(workflow_id==='landing-checks.yml' && !successfulJobs.some(j=>(j.name===expectedJob||j.name.endsWith(' / '+expectedJob)) && j.steps?.some(s=>s.name==='Site contracts (full)' && s.conclusion==='success'))){core.setFailed('Missing FULL Site contracts evidence');return;}
              if(workflow_id==='int24-browser-qa.yml' && !successfulJobs.some(j=>(j.name===expectedJob||j.name.endsWith(' / '+expectedJob)) && j.steps?.some(s=>s.name==='Start isolated local Admin Worker for FULL network audit' && s.conclusion==='success') && j.steps?.some(s=>s.name==='Run loopback preview and browser checks' && s.conclusion==='success'))){core.setFailed('Missing FULL Browser/Worker audit evidence');return;}
              if(workflow_id==='admin-world-checks.yml' && !names.some(n=>n==='Admin foundation contracts (Node 22)'||n.endsWith(' / Admin foundation contracts (Node 22)'))){core.setFailed('Missing Admin foundation FULL contracts');return;}
              evidence.push(workflow_id+': '+selected.html_url+' ('+selected.head_sha+')');
            }
            const {data:fresh}=await github.rest.pulls.get({owner,repo,pull_number:prNumber});
            if(fresh.head.sha!==expected){core.setFailed('PR HEAD changed during verification');return;}
            await core.summary.addHeading('CI-OPT-03 FULL evidence').addRaw('Exact HEAD: '+expected+'\\n\\n'+evidence.join('\\n\\n')).write();
            core.info('All required FULL workflow evidence verified on exact HEAD '+expected);
