name: UX16 temporary validation
on:
  pull_request:
    branches: [main, nav/issue-21-unique-routes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          for file in src/main.js src/ui.js; do
            node --input-type=module --check < "$file"
          done
      - name: Install Chrome and Edge test browsers
        working-directory: ux16-validation
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chrome msedge
      - name: Start Football Architect
        shell: bash
        run: |
          node server.mjs > ux16-server.log 2>&1 &
          echo $! > ux16-server.pid
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:2000/ >/dev/null && exit 0
            sleep 1
          done
          cat ux16-server.log
          exit 1
      - name: Chrome and Edge language-picker gate
        working-directory: ux16-validation
        run: node run.mjs
