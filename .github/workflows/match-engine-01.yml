name: Match Engine ME-01 targeted
on:
  pull_request:
    paths:
      - 'match-engine/**'
      - 'tools/dev-standings-preview.mjs'
      - '.github/workflows/match-engine-01.yml'
permissions:
  contents: read
concurrency:
  group: match-engine-01-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  match-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact PR HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: match-engine/package-lock.json
      - name: Install pinned physics candidate
        run: npm ci --prefix match-engine --no-audit --no-fund
      # A scoped Draft/HOLD PR uses only its exact-head focused evidence;
      # keep the accepted physics suite for the underlying PR #481 separate.
      - name: C2-b Rapier A/B + P1 pure intent contract (Draft PR 481)
        if: ${{ github.event.pull_request.number == 481 && github.event.pull_request.draft }}
        run: |
          node --test match-engine/tests/player-football-intent.test.mjs
          node --test match-engine/tests/player-ball-press-handoff-ab.test.mjs
      - name: Controlled action LAB source and real Rapier scenarios (Draft #620)
        if: ${{ github.head_ref == 'feat/620-action-labs' && github.event.pull_request.draft }}
        run: |
          node --test match-engine/tests/action-labs.test.mjs
          node --test match-engine/tests/lab-route.test.mjs
          node --test match-engine/tests/action-labs-browser.test.mjs
      # Keep the original full ME-01 job on review-ready PRs and all other PRs.
      - name: Focused core and route security tests
        if: ${{ !github.event.pull_request.draft || (github.event.pull_request.number != 481 && github.head_ref != 'feat/620-action-labs') }}
        run: npm --prefix match-engine test
      - name: Existing routing/preview regressions
        if: ${{ !github.event.pull_request.draft || (github.event.pull_request.number != 481 && github.head_ref != 'feat/620-action-labs') }}
        run: node --test tests/app-subdomain-preview.test.mjs tests/app-canonical-routes.test.mjs
      - name: Browser viewport fit (Chrome, Advanced settings open and closed)
        if: ${{ !github.event.pull_request.draft || (github.event.pull_request.number != 481 && github.head_ref != 'feat/620-action-labs') }}
        run: node --test match-engine/tests/lab-viewport-browser.test.mjs
      - name: Measured local CPU / memory sample
        if: ${{ !github.event.pull_request.draft || (github.event.pull_request.number != 481 && github.head_ref != 'feat/620-action-labs') }}
        run: npm --prefix match-engine run bench -- 6000
