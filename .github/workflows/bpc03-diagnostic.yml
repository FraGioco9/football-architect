name: B-PC03 fix and targeted gate

on:
  push:
    branches:
      - fix/bpc03-new-career-transition
    paths:
      - .github/workflows/bpc03-diagnostic.yml

permissions:
  contents: write

jobs:
  fix-and-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bpc03-new-career-transition

      - name: Reconstruct certified baseline
        shell: pwsh
        run: |
          $parts = Get-ChildItem ./release-b64/zip-*.part | Sort-Object Name
          $builder = New-Object System.Text.StringBuilder
          foreach ($part in $parts) { [void]$builder.Append((Get-Content $part.FullName -Raw)) }
          $bytes = [Convert]::FromBase64String($builder.ToString())
          [IO.File]::WriteAllBytes("./baseline.zip", $bytes)
          $actual=(Get-FileHash ./baseline.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne "686f3abaea01807b04d1811da093f6b017eb372f1abb57e6788e6d52bc78d74c") { throw "Unexpected baseline ZIP hash: $actual" }
          New-Item -ItemType Directory -Force work | Out-Null
          Expand-Archive -LiteralPath ./baseline.zip -DestinationPath ./work -Force

      - name: Apply minimal application fix
        shell: pwsh
        run: |
          $path="./work/football-architect/src/main.js"
          $raw=Get-Content $path -Raw
          $old="function refresh(message='') {if(save()){if(message)toast(message);else render();}}"
          $new="function refresh(message='') {if(save()){render();if(message)toast(message);}}"
          if(-not $raw.Contains($old)){ throw "Expected refresh implementation not found" }
          $raw=$raw.Replace($old,$new)
          Set-Content -Path $path -Value $raw -NoNewline -Encoding utf8
          node --check $path

      - name: Harden RST-01 A02
        shell: pwsh
        run: |
          $path="./rst01-runner/adapters/a-b.mjs"
          $raw=Get-Content $path -Raw
          $old=@'
              await buttons.nth(candidates[0].index).click().catch(()=>{});
              await page.waitForTimeout(250);
          '@
          $new=@'
              const chosen=candidates[0];
              await buttons.nth(chosen.index).click().catch(()=>{});
              if(chosen.action==='start-career'){
                await page.locator('.dashboard-hero').first().waitFor({state:'visible',timeout:5000}).catch(()=>{});
                const dashboardVisible=await page.locator('.dashboard-hero').first().isVisible().catch(()=>false);
                if(!dashboardVisible)return {ok:false,reason:'dashboard did not appear immediately after start-career without refresh or second action',fresh,steps};
                return {ok:true,fresh,steps};
              }
              await page.waitForTimeout(250);
          '@
          if(-not $raw.Contains($old)){ throw "Expected A02 click sequence not found" }
          $raw=$raw.Replace($old,$new)
          Set-Content -Path $path -Value $raw -NoNewline -Encoding utf8
          node --check $path

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install targeted browser dependencies
        working-directory: rst01-runner
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Create strict B-PC03 browser test
        shell: pwsh
        run: |
          $test=@'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';

          const baseURL='http://127.0.0.1:2000';
          const browsers={
            chrome:['C:/Program Files/Google/Chrome/Application/chrome.exe','C:/Program Files (x86)/Google/Chrome/Application/chrome.exe'],
            edge:['C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe','C:/Program Files/Microsoft/Edge/Application/msedge.exe']
          };
          const executable=xs=>xs.find(x=>fs.existsSync(x));

          async function run(name){
            const exe=executable(browsers[name]);
            if(!exe)throw new Error(name+' executable unavailable');
            const userData=await fsp.mkdtemp(path.join(os.tmpdir(),'fa-bpc03-'+name+'-'));
            const context=await chromium.launchPersistentContext(userData,{executablePath:exe,headless:true,viewport:{width:1280,height:900},args:['--no-first-run','--no-default-browser-check']});
            try{
              const page=context.pages()[0]||await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e?.message||e)));
              page.on('console',m=>{if(m.type()==='error'&&!/Failed to load resource: the server responded with a status of 404/i.test(m.text()))errors.push(m.text());});
              page.on('dialog',d=>d.accept());
              await page.goto(baseURL,{waitUntil:'domcontentloaded'});
              const newCareer=page.locator('[data-action="menu-new"]').first();
              await newCareer.waitFor({state:'visible',timeout:10000});
              await newCareer.click();
              const manager=page.locator('#manager-name');
              await manager.waitFor({state:'visible',timeout:10000});
              await manager.fill('BPC03 Manager');
              const start=page.locator('[data-action="start-career"]').first();
              await start.waitFor({state:'visible',timeout:10000});

              // Critical assertion: after this click there is deliberately no second action and no reload.
              await start.click();
              await page.locator('.dashboard-hero').first().waitFor({state:'visible',timeout:5000});
              if(await page.locator('[data-action="start-career"]').first().isVisible().catch(()=>false)){
                throw new Error('stale onboarding remained visible after start-career');
              }

              const persisted=await page.evaluate(async()=>{
                const rec=await new Promise((resolve,reject)=>{
                  const r=indexedDB.open('football-architect-primary-careers',1);
                  r.onsuccess=()=>{
                    const db=r.result;
                    const tx=db.transaction('snapshots','readonly');
                    const q=tx.objectStore('snapshots').get('primary');
                    q.onsuccess=()=>resolve(q.result);
                    q.onerror=()=>reject(q.error);
                  };
                  r.onerror=()=>reject(r.error);
                });
                const entries=new Map(JSON.parse(rec.raw));
                const catalog=JSON.parse(entries.get('football-architect:career:catalog:v1'));
                const active=catalog.slots.find(x=>x.id===catalog.activeSlotId);
                const career=JSON.parse(entries.get(active.storageKey));
                return {slotCount:catalog.slots.length,clubId:career.clubId,round:career.round,season:career.season};
              });
              if(persisted.slotCount!==1||!persisted.clubId)throw new Error('career was not durably persisted');

              await page.locator('[data-action="menu-home"]').first().click();
              await page.locator('.fa-main-menu').waitFor({state:'visible',timeout:10000});
              const cont=page.locator('[data-action="menu-continue"]').first();
              if(await cont.isDisabled())throw new Error('continue disabled after career creation');
              await cont.click();
              await page.locator('.dashboard-hero').first().waitFor({state:'visible',timeout:10000});
              if(errors.length)throw new Error('browser errors: '+errors.join(' | '));
              console.log(JSON.stringify({browser:name,state:'PASS',persisted}));
            } finally {
              await context.close().catch(()=>{});
            }
          }

          for(const name of ['chrome','edge'])await run(name);
          '@
          Set-Content -Path ./rst01-runner/.bpc03-targeted.mjs -Value $test -NoNewline -Encoding utf8

      - name: Start server and gate on Node 20
        shell: pwsh
        run: |
          $p=Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory "$PWD\work\football-architect" -PassThru
          $p.Id | Out-File -Encoding ascii ./server.pid
          for($i=0;$i -lt 60;$i++){try{$r=Invoke-WebRequest http://127.0.0.1:2000 -UseBasicParsing -TimeoutSec 2;if($r.StatusCode -eq 200){break}}catch{};Start-Sleep -Seconds 1}
          try { node ./rst01-runner/.bpc03-targeted.mjs } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Start server and gate on Node 24
        shell: pwsh
        run: |
          $p=Start-Process node -ArgumentList 'server.mjs' -WorkingDirectory "$PWD\work\football-architect" -PassThru
          for($i=0;$i -lt 60;$i++){try{$r=Invoke-WebRequest http://127.0.0.1:2000 -UseBasicParsing -TimeoutSec 2;if($r.StatusCode -eq 200){break}}catch{};Start-Sleep -Seconds 1}
          try { node ./rst01-runner/.bpc03-targeted.mjs } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Build patched immutable ZIP representation
        id: package
        shell: pwsh
        run: |
          if(Test-Path ./candidate.zip){Remove-Item ./candidate.zip -Force}
          tar.exe -a -c -f ./candidate.zip -C ./work football-architect
          $hash=(Get-FileHash ./candidate.zip -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Remove-Item ./release-b64/zip-*.part -Force
          $b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes("./candidate.zip"))
          $index=0
          for($offset=0;$offset -lt $b64.Length;$offset+=60000){
            $length=[Math]::Min(60000,$b64.Length-$offset)
            $chunk=$b64.Substring($offset,$length)
            Set-Content -Path ("./release-b64/zip-{0:d3}.part" -f $index) -Value $chunk -NoNewline -Encoding ascii
            $index++
          }
          $builder=New-Object System.Text.StringBuilder
          Get-ChildItem ./release-b64/zip-*.part | Sort-Object Name | ForEach-Object {[void]$builder.Append((Get-Content $_.FullName -Raw))}
          $roundtrip=[Convert]::FromBase64String($builder.ToString())
          [IO.File]::WriteAllBytes("./roundtrip.zip",$roundtrip)
          $roundtripHash=(Get-FileHash ./roundtrip.zip -Algorithm SHA256).Hash.ToLower()
          if($roundtripHash -ne $hash){throw "release-b64 roundtrip mismatch"}

      - name: Align future RST-01 immutable hash and document delta
        shell: pwsh
        env:
          NEW_HASH: ${{ steps.package.outputs.hash }}
        run: |
          $wfPath="./.github/workflows/rst01-windows.yml"
          $raw=Get-Content $wfPath -Raw
          $raw=$raw.Replace("686f3abaea01807b04d1811da093f6b017eb372f1abb57e6788e6d52bc78d74c",$env:NEW_HASH)
          Set-Content -Path $wfPath -Value $raw -NoNewline -Encoding utf8
          New-Item -ItemType Directory -Force ./docs/bpc03 | Out-Null
          $doc=@"
          # B-PC03 — immediate transition after new career creation

          Manual clean-PC finding: creating a new career persisted correctly but left the onboarding screen visible until refresh.

          Root cause: `refresh(message)` skipped `render()` whenever a toast message was supplied.

          Fix: render after every successful save, then show the optional toast.

          RST-01 A02 hardening: after clicking `start-career`, the dashboard must become visible without any second action or reload.

          Targeted gate: Chrome + Edge on Node 20 and Node 24.

          Baseline ZIP SHA-256: `686f3abaea01807b04d1811da093f6b017eb372f1abb57e6788e6d52bc78d74c`

          Patched candidate SHA-256: `$env:NEW_HASH`

          No deploy.
          "@
          Set-Content -Path ./docs/bpc03/README.md -Value $doc -Encoding utf8
          Remove-Item ./rst01-runner/.bpc03-targeted.mjs -Force
          git rm .github/workflows/bpc03-diagnostic.yml

      - name: Commit isolated fix after green targeted gate
        shell: pwsh
        run: |
          git config user.name "FraGioco9"
          git config user.email "giocolifrancesco@gmail.com"
          git add -A
          git status --short
          git commit -m "B-PC03: render dashboard immediately after career creation"
          git push origin HEAD:fix/bpc03-new-career-transition
