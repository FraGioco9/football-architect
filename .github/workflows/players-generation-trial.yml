name: Player Generator Trial (Node 22)
on:
  pull_request:
    branches: [main]
    paths:
      - tools/players-generation-trial.mjs
      - tools/build-players-runtime.mjs
      - backend/src/players-generator-core.mjs
      - backend/src/players-catalog.mjs
      - tests/players-generator-runtime-parity.test.mjs
      - tools/players-name-pools.mjs
      - tests/players-name-pools.test.mjs
      - data/players/names/**
      - data/players/surnames/**
      - tools/players-generation-audit.mjs
      - tools/players-generation-phase1-qa.mjs
      - tools/players-suitability-extremes-qa.mjs
      - .github/workflows/players-generation-trial.yml
permissions:
  contents: read
concurrency:
  group: players-trial-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generated-players:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checked-out PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate isolated test cohorts
        run: |
          mkdir -p "$RUNNER_TEMP/fa-ci-artifacts"
          node --check tools/players-name-pools.mjs
          node --test tests/players-name-pools.test.mjs
          node --check tools/players-generation-trial.mjs
          node --test tests/players-generator-runtime-parity.test.mjs
          node --check tools/players-generation-audit.mjs
          node tools/players-generation-audit.mjs --self-test > "$RUNNER_TEMP/fa-ci-artifacts/players-role-audit-self-test.json"
          node tools/players-generation-audit.mjs --count 1000 > "$RUNNER_TEMP/fa-ci-artifacts/players-role-audit-3000.json"
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const report=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'fa-ci-artifacts','players-role-audit-3000.json'),'utf8'));
          assert.equal(report.pooled.n,3000);
          assert.equal(Object.keys(report.pooled.roles).length,14);
          assert.equal(report.coherence_mix_proposed,.60);
          assert.deepEqual(report.offsets_previous,{A:12,B:4,C:-5,D:-13});
          assert.deepEqual(report.offsets_proposed,{A:15,B:5,C:-8,D:-13});
          assert.equal(report.prior60.n,3000);
          assert.equal(report.previousTiers.n,3000);
          assert.equal(report.core_role_directions.length,13);
          assert.deepEqual(report.owner_approved_prior_profiles.specialist,{share:.80,primary:.70,secondaries_total:.30});
          assert.deepEqual(report.owner_approved_prior_profiles.versatile,{share:.20,primary:.50,secondaries_total:.50});
          assert.deepEqual(report.proposed_profiles.specialist,{share:.45,primary:.70,secondaries_total:.30});
          assert.deepEqual(report.proposed_profiles.versatile,{share:.55,primary:.50,secondaries_total:.50});
          assert.equal(report.proposed_profiles.secondary_favored,null);
          assert.ok(report.approved80.secondary_fit.versatile_share>=.15);
          assert.ok(report.approved80.secondary_fit.versatile_share<=.25);
          assert.ok(report.pooled.secondary_fit.versatile_share>=.49);
          assert.ok(report.pooled.secondary_fit.versatile_share<=.64);
          assert.equal(report.measured_target_met,true,
            'Secondary 5-10%, equivalent 20-25%, primary 65-75% all required');
          const fit=report.pooled.secondary_fit;
          assert.ok(fit.secondary_better_share>=.05&&fit.secondary_better_share<=.10);
          assert.ok(fit.equivalent_share>=.20&&fit.equivalent_share<=.25);
          assert.ok(fit.primary_better_share>=.65&&fit.primary_better_share<=.75);
          assert.equal(fit.secondary_better_by_3+fit.equivalent_within_3+
            fit.primary_better_by_3,fit.possible);
          assert.equal(report.prior55.n,3000);
          assert.equal(report.uncorrected.n,3000);
          assert.equal(report.preTarget.n,3000);
          assert.equal(report.suitability_generation.mode,'automatic_target_first');
          assert.equal(report.suitability_generation.not_persisted,true);
          assert.equal(report.suitability_generation.tolerance,.5);
          assert.equal(report.suitability_generation.maximum_primary_suitability,90);
          assert.ok(report.suitability_generation.desired.max<=90);
          assert.ok(report.suitability_generation.max_absolute_error<=.500001);
          assert.deepEqual(report.provisional_role_core_floor,{
            primary_only:6,specialist:10,versatile:12,
            reference:'median of four essential (A) plus four supporting (B) attributes',
            height_modifiers_applied_after_core_floor:true,
            preserves_manual_overrides:true
          });
          assert.equal(Object.keys(report.core_floor.by_role).length,14);
          assert.ok(Object.values(report.core_floor.by_role).every(r=>r.players_changed>0));
          assert.ok(report.core_floor.corrected_attributes>0);
          const shot=report.comparison.trial_0143_before_after;
          assert.ok(Number.isInteger(shot.shooting_before)&&shot.shooting_before>=1&&shot.shooting_before<=99);
          assert.ok(Number.isInteger(shot.shooting_after)&&shot.shooting_after>=shot.shooting_before&&shot.shooting_after<=99);
          assert.equal(report.no_suitability_score_recalibration,true);
          assert.deepEqual(report.provisional_position_expression,{
            mean:15,sd:12,clamp:35,max_skill_change:25});
          assert.ok(report.pooled.secondary_fit.no_secondary_favored);
          assert.ok(Object.entries(report.role_tiers).every(([role,t])=>
            t.A>t.B&&(role==='GK'||t.B>t.C)));
          assert.ok(report.pooled.spread.mean<50);
          assert.ok(report.core_role_directions.every(item=>item.passed));
          const selected=['ST__CB__shooting','CB__ST__tackling','RW__CB__speed','CM__CB__passing','GK__ST__gk_reflexes','ST__CB__heading'];
          console.log(JSON.stringify({v6_spread:report.baseline.spread,
            old60_spread:report.prior60.spread,
            previous_tier_spread:report.previousTiers.spread,
            proposed_spread:report.pooled.spread,
            secondary_fit_before_target:report.preTarget.secondary_fit,
            secondary_fit_new:report.pooled.secondary_fit,
            suitability_target_generation:report.suitability_generation,
            core_floor:report.core_floor,
            trial_0143:report.comparison.trial_0143_before_after,
            per_seed_buckets:report.comparison.per_seed_bucket_comparison,
            meets_all_3_targets:report.measured_target_met,
            comparison:report.comparison}));
          for(const key of selected)console.log(JSON.stringify({
            name:key,baseline:report.baseline.contrasts[key],
            proposed:report.pooled.contrasts[key]
          }));
          AUDIT
          node tools/players-generation-trial.mjs --self-test > "$RUNNER_TEMP/fa-ci-artifacts/players-self-test.json"
          node --check tools/players-suitability-extremes-qa.mjs

          node tools/players-generation-trial.mjs --count 3 --seed fixed-75 --primary-suitability 75 --out "$RUNNER_TEMP/fa-ci-artifacts/players-fixed-75.json" > /dev/null
          node tools/players-generation-trial.mjs --count 3 --seed range-65-80 --primary-suitability 65:80 --out "$RUNNER_TEMP/fa-ci-artifacts/players-range-65-80.json" > /dev/null
          node --input-type=module <<'SUITABILITY'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {calculatePositionSuitability} from './tools/players-generation-trial.mjs';
          const dir=join(process.env.RUNNER_TEMP,'fa-ci-artifacts');
          for(const [file,low,high] of [['players-fixed-75.json',75,75],
           ['players-range-65-80.json',65,80]]){
           const trial=JSON.parse(readFileSync(join(dir,file),'utf8'));
           assert.equal(trial.count,3);
           assert.equal(trial.persisted,false);
           for(const p of trial.candidates){
            // Only real player attributes appear in exported JSON. Generator
            // target/profile QA properties are deliberately non-serializable.
            for(const hidden of ['trial_role_profile','trial_primary_suitability_target',
             'trial_primary_suitability_actual'])assert.equal(hidden in p,false);
            const actual=calculatePositionSuitability(p.attributes,p.primary_position);
            assert.ok(actual>=low-.500001&&actual<=high+.500001,
             'Rendered player abilities must match the requested target window');
            assert.equal(Object.keys(p.attributes).length,20);
           }
          }
          SUITABILITY
          # Legacy full-JSON hashes include the old 3-name demo identity fixture.
          # Since PLAYERS-03 supplies 50 weighted national name pools, verify
          # exact seeded replay instead. Numerical ability contracts remain frozen.
          node --input-type=module <<'REPLAY'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {generateTrial} from './tools/players-generation-trial.mjs';
          const oldOffsets={A:12,B:4,C:-5,D:-13};
          const baseline=generateTrial({count:1000,seed:'fa-official-trial-01',
            experimentalCoherenceMix:.65,experimentalRoleOffsets:oldOffsets,experimentalLegacySecondaryModel:true});
          const bytes=JSON.stringify(baseline,null,2)+'\n';
          const sha=createHash('sha256').update(bytes).digest('hex');
          const baselineReplay=generateTrial({count:1000,seed:'fa-official-trial-01',
            experimentalCoherenceMix:.65,experimentalRoleOffsets:oldOffsets,experimentalLegacySecondaryModel:true});
          assert.equal(sha,createHash('sha256').update(JSON.stringify(baselineReplay,null,2)+'\n').digest('hex'));
          console.log('Seeded V6 1k replay SHA-256 (catalog-identity aware):',sha);
          const prior60=generateTrial({count:1000,seed:'fa-official-trial-01',
            experimentalRoleOffsets:oldOffsets,experimentalLegacySecondaryModel:true});
          const prior60sha=createHash('sha256')
            .update(JSON.stringify(prior60,null,2)+'\n').digest('hex');
          const prior60Replay=generateTrial({count:1000,seed:'fa-official-trial-01',
            experimentalRoleOffsets:oldOffsets,experimentalLegacySecondaryModel:true});
          assert.equal(prior60sha,createHash('sha256').update(JSON.stringify(prior60Replay,null,2)+'\n').digest('hex'));
          console.log('Seeded prior-60% 1k replay SHA-256:',prior60sha);
          const previous55=generateTrial({count:1000,seed:'fa-official-trial-01',
            experimentalRoleExpression:false,experimentalRoleCoreFloor:false,
            experimentalPrimarySuitabilityModel:false});
          const previous55sha=createHash('sha256')
            .update(JSON.stringify(previous55,null,2)+'\n').digest('hex');
          const previous55Replay=generateTrial({count:1000,seed:'fa-official-trial-01',
            experimentalRoleExpression:false,experimentalRoleCoreFloor:false,
            experimentalPrimarySuitabilityModel:false});
          assert.equal(previous55sha,createHash('sha256').update(JSON.stringify(previous55Replay,null,2)+'\n').digest('hex'));
          console.log('Seeded previous-55% 1k replay SHA-256:',previous55sha);
          REPLAY
          node tools/players-generation-trial.mjs --count 100 --seed fa-official-trial-01 --out "$RUNNER_TEMP/fa-ci-artifacts/players-trial-100.json" > "$RUNNER_TEMP/fa-ci-artifacts/players-100-summary.json"
          node tools/players-generation-trial.mjs --count 1000 --seed fa-official-trial-01 --out "$RUNNER_TEMP/fa-ci-artifacts/players-trial-1000.json" > "$RUNNER_TEMP/fa-ci-artifacts/players-1000-summary.json"
          node tools/players-suitability-extremes-qa.mjs --audit-path "$RUNNER_TEMP/fa-ci-artifacts/players-role-audit-3000.json" --trial-path "$RUNNER_TEMP/fa-ci-artifacts/players-trial-1000.json" --out "$RUNNER_TEMP/fa-ci-artifacts/players-extreme-role-qa.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const base=join(process.env.RUNNER_TEMP,'fa-ci-artifacts');
          const small=JSON.parse(readFileSync(join(base,'players-trial-100.json'),'utf8'));
          const trial=JSON.parse(readFileSync(join(base,'players-trial-1000.json'),'utf8'));
          const self=JSON.parse(readFileSync(join(base,'players-self-test.json'),'utf8'));
          assert.equal(self.passed,true);
          assert.equal(small.count,100);
          assert.equal(trial.count,1000);
          assert.equal(trial.ranking_snapshot,'2026-10-07');
          assert.equal(trial.persisted,false);
          const previewIds=new Set(),nationalities=new Map(),pairCounts=new Map();
          let secondary=0,gk=0,maxOutfieldGK=0,totalSpread=0;
          const gkFields=['gk_reflexes','gk_handling','gk_positioning','gk_aerial'];
          const source=readFileSync('tools/players-generation-trial.mjs','utf8');
          const allowlist=source.match(/const relatedPairs=\[([\s\S]*?)\];/)?.[1];
          assert.ok(allowlist,'Explicit auto nationality allowlist missing');
          const allowed=new Set();
          for(const [,a,b] of allowlist.matchAll(/'([A-Z]{3})-([A-Z]{3})'/g)){
            assert.notEqual(a,b);
            const pair=[a,b].sort().join('-');
            assert.ok(!allowed.has(pair),'Duplicate allowlist pair: '+pair);
            allowed.add(pair);
          }
          assert.equal(allowed.size,90);
          for(const p of trial.candidates){
            assert.ok(!previewIds.has(p.preview_id));
            previewIds.add(p.preview_id);
            assert.equal('id' in p,false);
            assert.equal('entry_season' in p,false);
            nationalities.set(p.nationality,(nationalities.get(p.nationality)||0)+1);
            assert.ok(Number.isInteger(p.initial_age)&&p.initial_age>=16&&p.initial_age<=19);
            assert.ok(Number.isInteger(p.height_cm)&&p.height_cm>=160&&p.height_cm<=205);
            assert.ok(Number.isInteger(p.development_aptitude)&&p.development_aptitude>=1&&p.development_aptitude<=99);
            const values=Object.values(p.attributes);
            assert.equal(values.length,20);
            assert.ok(values.every(x=>Number.isInteger(x)&&x>=1&&x<=99));
            const ordinary=Object.entries(p.attributes).filter(([k])=>!gkFields.includes(k)).map(([,v])=>v);
            totalSpread+=Math.max(...ordinary)-Math.min(...ordinary);
            if(p.primary_position==='GK'){gk++;assert.equal(p.secondary_positions.length,0)}
            else {
              for(const a of gkFields){assert.ok(p.attributes[a]<=15);maxOutfieldGK=Math.max(maxOutfieldGK,p.attributes[a])}
            }
            if(p.secondary_nationality){
              secondary++;
              assert.notEqual(p.nationality,p.secondary_nationality);
              const pair=[p.nationality,p.secondary_nationality].sort().join('-');
              assert.ok(allowed.has(pair),'Unrelated pair: '+pair);
              const directed=p.nationality+'→'+p.secondary_nationality;
              pairCounts.set(directed,(pairCounts.get(directed)||0)+1);
            }
          }
          assert.equal(previewIds.size,1000);
          assert.equal(nationalities.size,50);
          assert.ok([...nationalities.values()].every(n=>n===20));
          assert.ok(secondary>=50&&secondary<=150);
          assert.ok(totalSpread/trial.count<40);
          const result={head:process.env.GITHUB_SHA,seed:trial.seed,players:trial.count,countries:nationalities.size,
            secondary_nationalities:secondary,unique_ordered_pairs:pairCounts.size,
            allowed_country_pairs:allowed.size,unrelated_pairs:0,goalkeepers:gk,
            max_auto_outfielder_gk:maxOutfieldGK,mean_field_spread:Number((totalSpread/trial.count).toFixed(2)),
            self_test:'PASS',reproducible:true,persisted:false};
          writeFileSync(join(base,'players-check-report.json'),JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE
          # Phase-1 evidence: three independent 1k cohorts, four forced country
          # pairs and manual-name marginals. This is observational QA only.
          node --check tools/players-generation-phase1-qa.mjs
          node tools/players-generation-phase1-qa.mjs --json "$RUNNER_TEMP/fa-ci-artifacts/players-phase1-qa.json" --markdown "$RUNNER_TEMP/fa-ci-artifacts/players-phase1-qa.md"
      - name: Retain trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-generation-trial-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fa-ci-artifacts/
          if-no-files-found: warn
          retention-days: 7
