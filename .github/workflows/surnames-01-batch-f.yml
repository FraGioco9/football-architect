name: SURNAMES-01 Batch F — Node 22 targeted QA
on:
  pull_request:
    paths:
      - 'data/players/surnames/countries/**'
      - '.github/workflows/surnames-01-batch-f.yml'
  workflow_dispatch:
jobs:
  surnames-batch-f:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate four surname pools and Unicode rejection tests
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const codes = ['CRO', 'SRB', 'HUN', 'RUS'];
          const latin = /^(?:\p{Script=Latin}\p{M}*)+(?:[ '\u2019-](?:\p{Script=Latin}\p{M}*)+)*$/u;
          const markLatin = /\p{Script_Extensions=Latin}/u;
          const forbidden = new Set(['weight', 'frequency', 'rank_weight', 'probability', 'probabilities']);
          const allowedTop = ['schema_version', 'code', 'kind', 'selection_policy', 'sources', 'surnames', 'production_ready'];
          function valid(v) {
            return typeof v === 'string' && v.length > 0 && v === v.normalize('NFC')
              && latin.test(v) && [...v.matchAll(/\p{M}/gu)].every(([m]) => markLatin.test(m));
          }
          for (const bad of ['Иванов', 'Jοvanović', 'Παπαδόπουλος', '山田', 'Abc7', 'A_B', 'A\u0301\u0302'])
            assert.equal(valid(bad), false, 'adversarial name unexpectedly accepted: ' + bad);
          for (const good of ['Horvat', 'Kovačević', 'Đurić', 'Szűcs', 'Ősz', 'Zajtsev', 'O\u2019Brien'])
            assert.equal(valid(good), true, 'valid name rejected: ' + good);
          for (const code of codes) {
            const file = 'data/players/surnames/countries/' + code + '.json';
            const bank = JSON.parse(readFileSync(file, 'utf8'));
            assert.deepEqual(Object.keys(bank).sort(), [...allowedTop].sort(), 'unexpected schema: ' + code);
            assert.equal(bank.schema_version, 1); assert.equal(bank.code, code);
            assert.equal(bank.kind, 'surnames'); assert.equal(bank.selection_policy, 'uniform');
            assert.equal(bank.production_ready, false);
            assert.ok(Array.isArray(bank.sources) && bank.sources.length > 0);
            assert.ok(Array.isArray(bank.surnames) && bank.surnames.length === 500, 'expected 500: ' + code);
            const seen = new Set();
            const fold = new Set();
            for (const [index, entry] of bank.surnames.entries()) {
              assert.deepEqual(Object.keys(entry), ['value'], code + '[' + index + '] value-only');
              for (const forbiddenKey of forbidden) assert.equal(Object.hasOwn(entry, forbiddenKey), false);
              assert.ok(valid(entry.value), code + '[' + index + '] invalid Unicode Latin NFC');
              const key = entry.value.toLowerCase();
              assert.ok(!seen.has(key), code + '[' + index + '] duplicate ' + entry.value);
              seen.add(key);
              if (code === 'HUN') {
                const accentFold = entry.value.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
                assert.ok(!fold.has(accentFold), 'HUN accent-equivalent duplicate: ' + entry.value);
                fold.add(accentFold);
              }
            }
            console.log('PASS ' + code + ': 500 Latin NFC unique surnames, uniform selection, value-only entries');
          }
          console.log('PASS SURNAMES-01 Batch F: 2,000 surnames, negative-script and format controls');
          NODE
