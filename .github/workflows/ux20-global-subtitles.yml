name: UX20 global page subtitles
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared page header contract
        run: node ux20-global-subtitles/component.mjs
      - name: Install browser
        working-directory: ux20-global-subtitles
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Football Architect
        run: |
          node server.mjs > ux20-global-subtitles-server.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:2000/ >/dev/null && exit 0
            sleep 1
          done
          cat ux20-global-subtitles-server.log
          exit 1
      - name: Browser page subtitle contract
        working-directory: ux20-global-subtitles
        run: node browser.mjs
