name: Football Architect Browser QA
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact PR checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$EXPECTED" ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify fast-safe changes
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "mode=fast" >> "$GITHUB_OUTPUT"
            echo "Draft PR: quick safety and contracts only. FULL required on ready_for_review."
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Final review or main: mandatory full regression suite."
          fi
      - name: Defer full browser checks on draft or provider-only PR
        if: steps.scope.outputs.mode == 'fast'
        run: echo 'Full browser suite deferred to ready-for-review or main; fast-safe scope.'
      - name: Install isolated browser test dependency
        if: steps.scope.outputs.mode != 'fast'
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install chromium
          npx playwright install --with-deps webkit
      - name: Run loopback preview and browser checks
        if: steps.scope.outputs.mode != 'fast'
        run: |
          node tools/dev-standings-preview.mjs > /tmp/int24-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2000/competitions >/dev/null; then break; fi
            sleep 1
          done
          node tests/int24-browser-qa.mjs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_BASE_SHA="${{ github.event.pull_request.base.sha }}" node tests/clean-ui-03-css-parity.mjs
          else
            echo "CSS base/HEAD parity is PR-only; retaining all push browser checks."
          fi
          node tests/clean-ui-03-network-baseline.mjs
          node tests/clean-ui-03-webkit-iphone.mjs
      - name: Upload screenshots and server log
        if: always() && steps.scope.outputs.mode != 'fast'
        uses: actions/upload-artifact@v4
        with:
          name: int24-chromium-screenshots
          path: |
            int24-browser-artifacts/
            /tmp/int24-preview.log
          if-no-files-found: warn
