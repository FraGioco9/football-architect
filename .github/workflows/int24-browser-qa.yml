name: INT-24 Chromium QA
on:
  pull_request:
    paths:
      - 'assets/international-cups.js'
      - 'competitions/**'
      - 'tests/int24-browser-qa.mjs'
      - '.github/workflows/int24-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$EXPECTED" ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run loopback preview and browser checks
        run: |
          node tools/dev-standings-preview.mjs > /tmp/int24-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2000/competitions >/dev/null; then break; fi
            sleep 1
          done
          node tests/int24-browser-qa.mjs
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int24-chromium-screenshots
          path: |
            int24-browser-artifacts/
            /tmp/int24-preview.log
          if-no-files-found: warn
