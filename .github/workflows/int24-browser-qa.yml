name: Football Architect Browser QA
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  actions: read
  contents: read
jobs:
  # Focused Draft diagnostics are covered by Admin World; retain normal final/main gates.
  scope:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || !contains(github.event.pull_request.body, '<!-- admin-world-focused-verification -->') }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      area: ${{ steps.scope.outputs.area }}
      tests: ${{ steps.scope.outputs.tests }}
      reuse: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact classification checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Discover test ownership before expensive checks
        run: node tools/ci-discovery.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify fast-safe changes
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ] && [ "${{ contains(github.event.pull_request.body, '<!-- admin-world-final-verification -->') }}" != "true" ]; then
            node tools/ci-opt-01-impact.mjs >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Final review or main: mandatory full regression suite."
          fi
      - name: Reuse completed exact-head FULL evidence
        id: reuse
        uses: actions/github-script@v7
        with:
          script: |
            if(context.payload.pull_request?.head.repo.full_name!==context.repo.owner+'/'+context.repo.repo)return;
            const {findReusable}=require('./tools/ci-full-evidence.cjs');
            const run=await findReusable({github,...context.repo,sha:context.payload.pull_request?.head.sha||context.sha,workflow:'int24-browser-qa.yml',currentRun:context.runId,prNumber:context.payload.pull_request.number,baseSha:context.payload.pull_request.base.sha});
            core.setOutput('run_id',run||'');
            if(run)await core.summary.addRaw('Reused completed FULL evidence on identical HEAD: '+process.env.GITHUB_SERVER_URL+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+run).write();


  chromium:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || !contains(github.event.pull_request.body, '<!-- admin-world-focused-verification -->') }}
    needs: scope
    runs-on: ubuntu-24.04
    # Official image supplies Chromium + WebKit system libraries for FULL QA.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --add-host=app.localhost:127.0.0.1
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && needs.scope.outputs.mode != 'full' && format('pr-{0}-{1}', github.event.pull_request.number, needs.scope.outputs.mode) || format('main-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && needs.scope.outputs.mode != 'full' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact PR checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The official browser image runs as a different uid from the checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$EXPECTED" ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED"
          fi
      - name: Discover test ownership before expensive checks
        run: node tools/ci-discovery.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Defer full browser checks on draft or provider-only PR
        if: ${{ (needs.scope.outputs.mode == 'fast') && !needs.scope.outputs.reuse }}
        run: echo 'Full browser suite deferred to ready-for-review or main; fast-safe scope.'
      - name: Restore pinned Playwright browser cache
        if: ${{ (needs.scope.outputs.mode != 'fast') && !needs.scope.outputs.reuse }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-1.58.2-v3
      - name: Install isolated browser test dependency
        if: ${{ (needs.scope.outputs.mode != 'fast') && !needs.scope.outputs.reuse }}
        run: |
          if [ "${{ needs.scope.outputs.mode }}" = "targeted" ]; then
            npm install --no-save --no-package-lock playwright@1.58.2
          else
            npm install --no-save --no-package-lock playwright@1.58.2 pixelmatch@7.1.0 pngjs@7.0.0
          fi
          # Install both engines and native dependencies in one pass.
          # Slow Ubuntu mirrors previously exhausted the 20-minute job budget.
          if [ "$PLAYWRIGHT_BROWSERS_PATH" = /ms-playwright ]; then
            npx playwright install chromium webkit
          elif ! timeout 120s npx playwright install --with-deps chromium webkit; then
            echo "::warning::Ubuntu APT bootstrap unavailable; installing pinned browsers without retrying OS packages"
            npx playwright install chromium webkit
          fi
      - name: Run loopback preview and browser checks
        if: ${{ (needs.scope.outputs.mode != 'fast') && !needs.scope.outputs.reuse }}
        run: |
          node tools/dev-standings-preview.mjs > /tmp/int24-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2000/competitions >/dev/null; then break; fi
            sleep 1
          done
          if [ "${{ needs.scope.outputs.mode }}" = "targeted" ]; then
            FA_TARGET_AREA="${{ needs.scope.outputs.area }}" node tools/ci-run.mjs 1-int24-browser-qa -- node tests/ci-opt-01-browser-smoke.mjs
            FA_BROWSER_ENGINE=webkit FA_TARGET_AREA="${{ needs.scope.outputs.area }}" node tools/ci-run.mjs 2-int24-browser-qa -- node tests/ci-opt-01-browser-smoke.mjs
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- 'tools/ci-opt-01-*' 'tests/ci-opt-01-*' .github/workflows | grep -q .; then
            node tools/ci-opt-01-scenarios.mjs --browser
          fi
          node tools/ci-run.mjs 3-int24-browser-qa -- node tests/int24-browser-qa.mjs
          node tools/ci-run.mjs 7-int24-browser-qa -- node tests/page-load-02-club-browser.mjs
          node tools/ci-run.mjs repo-493-first-paint -- node tests/repo-493-first-paint-browser.mjs
          node tools/ci-run.mjs fe-05-visual -- node tests/fe-05-visual-browser.mjs
          node tools/ci-run.mjs fe-02-chromium -- node tests/fe-02-responsive-browser.mjs
          FA_BROWSER_ENGINE=webkit node tools/ci-run.mjs fe-02-webkit -- node tests/fe-02-responsive-browser.mjs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            test "$BASE" != ""
            if git diff --name-only "$BASE"...HEAD -- "assets/app.css" | grep -q .; then
              PR_BASE_SHA="$BASE" node tools/ci-run.mjs 4-int24-browser-qa -- node tests/clean-ui-03-css-parity.mjs
            else
              echo "app.css unchanged; its baseline-versus-HEAD parity audit is not applicable. FULL Chromium and WebKit remain required."
            fi
          else
            echo "CSS base/HEAD parity is PR-only; retaining push browser tests."
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- assets/landing.css assets/app.css assets/account.css assets/clubs-directory.css assets/club-page.css assets/competition-awards.css assets/admin-settings.css | grep -q .; then
            PR_BASE_SHA="${{ github.event.pull_request.base.sha }}" node tools/ci-run.mjs 8-int24-browser-qa -- node tests/fe-01-visual-parity.mjs
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/ci-run.mjs 5-int24-browser-qa -- node tests/clean-ui-03-network-baseline.mjs
          else
            echo "Network footprint baseline is diagnostic-only; skipped on regular FULL runs."
          fi
          node tools/ci-run.mjs 6-int24-browser-qa -- node tests/clean-ui-03-webkit-iphone.mjs
      - name: FULL coverage completed
        if: needs.scope.outputs.mode == 'full'
        run: echo 'All Browser FULL source checks completed on exact HEAD.'
      - name: Upload screenshots and server log
        if: always() && needs.scope.outputs.mode != 'fast'
        uses: actions/upload-artifact@v4
        with:
          name: int24-chromium-screenshots
          path: |
            ${{ runner.temp }}/fa-ci-artifacts/
            int24-browser-artifacts/
            /tmp/int24-preview.log
          if-no-files-found: warn
          retention-days: 7
