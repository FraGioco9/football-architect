name: UX20 00A temporary validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --input-type=module --check < src/home-menu.js
          node --input-type=module --check < ux20-00a-validation/run.mjs
      - name: 00A home contract
        run: node ux20-00a-validation/run.mjs
