name: CAL-17 realistic calendar validation

on:
  push:
    branches:
      - cal/issue-17-realistic-calendar
    paths:
      - .github/workflows/cal17-validation.yml

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax
        run: |
          find src -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check server.mjs
      - name: Calendar model gate
        run: |
          cat > .cal17-test.mjs <<'EOF'
          import {makeWorld} from './src/data.js';
          import {startCareer,advanceDay,simulateRound,newSeason} from './src/domain/career.js';
          import {validateSave} from './src/domain/save-validation.js';
          import {previewCalendarAdvance} from './src/domain/career-calendar.js';
          import {LEAGUES} from './src/leagues.js';
          import {
            CAREER_CALENDAR_VERSION,isCareerDate,isCareerKickoff,daysBetweenISO,addDaysISO
          } from './src/domain/career-date.js';

          const assert=(ok,msg,data={})=>{if(!ok)throw new Error(msg+' '+JSON.stringify(data));};
          const dow=value=>new Date(value+'T00:00:00Z').getUTCDay();
          const calendarToken=(w,days)=>{
            if(!w.advancedV1?.calendarV1||days<=0)return null;
            return previewCalendarAdvance(w,{toDay:w.advancedV1.clockDay+days}).confirmationToken;
          };

          for(const league of LEAGUES){
            const seed=170000+league.id.charCodeAt(0);
            const a=makeWorld(seed,league.id),b=makeWorld(seed,league.id);
            assert(a.calendarModelVersion===CAREER_CALENDAR_VERSION,'calendar version missing',{country:league.id});
            assert(a.currentDate===a.seasonStartDate,'career does not start in preseason',{country:league.id,current:a.currentDate,start:a.seasonStartDate});
            assert(daysBetweenISO(a.currentDate,a.firstMatchDate)>=28,'preseason too short',{country:league.id,start:a.currentDate,first:a.firstMatchDate});
            assert(JSON.stringify(a.fixtures)===JSON.stringify(b.fixtures),'calendar not deterministic',{country:league.id});

            const dates=a.fixtures.map(r=>r.date),weekends=a.fixtures.filter(r=>r.slot==='weekend'),midweeks=a.fixtures.filter(r=>r.slot==='midweek');
            assert(dates.every(isCareerDate),'invalid round date',{country:league.id});
            assert(dates.every((date,i)=>i===0||date>dates[i-1]),'round dates not strictly increasing',{country:league.id});
            assert(weekends.length>midweeks.length*5,'weekend is not predominant',{country:league.id,weekends:weekends.length,midweeks:midweeks.length});
            assert(midweeks.length>=4,'not enough midweek rounds',{country:league.id,midweeks:midweeks.length});
            assert(weekends.every(r=>[0,6].includes(dow(r.date))),'weekend round outside weekend',{country:league.id});
            assert(midweeks.every(r=>[2,3,4].includes(dow(r.date))),'midweek round outside Tue-Thu',{country:league.id});
            const kickoffs=new Set(a.fixtures.flatMap(r=>r.matches.map(m=>m.kickoff)));
            assert(kickoffs.size>=3,'kickoff times do not vary',{country:league.id,kickoffs:[...kickoffs]});
            assert(a.fixtures.every(r=>r.matches.every(m=>m.date===r.date&&isCareerKickoff(m.kickoff)&&m.datetime===m.date+'T'+m.kickoff+':00')),'fixture date/time persistence invalid',{country:league.id});

            startCareer(a,1,'CAL 17');
            assert(validateSave(a),'new dated career invalid',{country:league.id});
            const start=a.currentDate,first=a.fixtures[0].date;
            let ticks=0;
            while(a.currentDate<first&&ticks<100){
              const token=calendarToken(a,1);
              const before=a.currentDate;
              const result=advanceDay(a,{calendarConfirmationToken:token,simulateDueMatch:false});
              assert(result.advanced&&a.currentDate===addDaysISO(before,1),'daily tick skipped date',{country:league.id,before,after:a.currentDate});
              assert(a.round===0,'league played during preseason',{country:league.id,date:a.currentDate});
              ticks++;
            }
            assert(a.currentDate===first,'did not reach first fixture date',{country:league.id,current:a.currentDate,first});
            const played=advanceDay(a,{simulateDueMatch:true});
            assert(played.match&&a.round===1,'first fixture not played on scheduled date',{country:league.id});
            assert(validateSave(a),'save invalid after first fixture',{country:league.id});

            // Direct simulation must respect variable gaps, including midweek rounds.
            for(let guard=0;a.round<12&&guard<20;guard++){
              const next=a.fixtures[a.round],days=Math.max(0,daysBetweenISO(a.currentDate,next.date));
              simulateRound(a,{calendarConfirmationToken:calendarToken(a,days)});
              assert(a.currentDate===next.date,'direct simulation ignored scheduled date',{country:league.id,round:a.round,current:a.currentDate,expected:next.date});
            }
            assert(validateSave(a),'save invalid after mixed weekend/midweek run',{country:league.id});
            console.log('CAL17_COUNTRY_PASS',league.id,{start,first,weekends:weekends.length,midweeks:midweeks.length,kickoffs:[...kickoffs]});
          }

          // Rollover: complete one country and verify a fresh preseason and new realistic season.
          {
            const w=makeWorld(171717,'IT');startCareer(w,1,'Rollover');
            while(w.round<w.fixtures.length){
              const next=w.fixtures[w.round],days=Math.max(0,daysBetweenISO(w.currentDate,next.date));
              simulateRound(w,{calendarConfirmationToken:calendarToken(w,days)});
            }
            const lastDate=w.currentDate,oldYear=w.seasonCalendarYear;
            newSeason(w);
            assert(w.season===2&&w.round===0,'season did not roll over');
            assert(w.seasonCalendarYear===oldYear+1,'calendar year did not roll over',{oldYear,newYear:w.seasonCalendarYear});
            assert(w.currentDate===w.seasonStartDate&&w.currentDate>lastDate,'new season did not enter a future preseason',{lastDate,current:w.currentDate});
            assert(daysBetweenISO(w.currentDate,w.firstMatchDate)>=28,'next preseason too short',{start:w.currentDate,first:w.firstMatchDate});
            assert(validateSave(w),'rolled-over realistic calendar invalid');
            console.log('CAL17_ROLLOVER_PASS',w.currentDate,w.firstMatchDate);
          }
          console.log('CAL17_ALL_PASS');
          EOF
          node .cal17-test.mjs
          rm .cal17-test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser harness
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.55.1
      - name: Preseason and kickoff UI smoke
        run: |
          cat > .cal17-browser.mjs <<'EOF'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          if(!exe)throw new Error('Chrome unavailable');
          const assert=(ok,msg,data={})=>{if(!ok)throw new Error(msg+' '+JSON.stringify(data));};
          const profile=await fsp.mkdtemp(path.join(os.tmpdir(),'fa-cal17-'));
          const context=await chromium.launchPersistentContext(profile,{executablePath:exe,headless:true,viewport:{width:1440,height:950},args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            const page=context.pages()[0]||await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(String(e?.message||e)));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon|404/i.test(m.text()))errors.push(m.text());});
            await page.goto('http://127.0.0.1:2000',{waitUntil:'domcontentloaded'});
            await page.locator('.fa-main-menu').waitFor({state:'visible',timeout:15000});
            await page.locator('[data-action="menu-new"]').click();
            await page.locator('#manager-name').fill('CAL 17 UI');
            await page.locator('[data-action="start-career"]').click();
            await page.locator('.dashboard-hero').waitFor({state:'visible',timeout:15000});
            const it=(await page.locator('body').innerText());
            assert(it.includes('PRESTAGIONE'),'Italian preseason label missing');
            assert(/\b\d{2}:\d{2}\b/.test(it),'kickoff time missing from dashboard');
            const native=page.locator('.language-switch select').first();
            await native.selectOption('en');await page.waitForTimeout(150);
            const en=await page.locator('body').innerText();
            assert(en.includes('PRE-SEASON'),'English preseason label missing');
            await page.locator('button[data-action="nav"][data-page="calendar"]:visible').first().click();
            const cal=await page.locator('body').innerText();
            assert(cal.includes('WEEKEND')||cal.includes('MIDWEEK'),'calendar slot label missing');
            assert(/\b\d{2}:\d{2}\b/.test(cal),'kickoff time missing from calendar');
            assert(errors.length===0,'browser errors',{errors});
            console.log('CAL17_BROWSER_PASS');
          }finally{await context.close();}
          EOF
          node server.mjs > .server.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:2000 >/dev/null; then break; fi; sleep 1; done
          set +e
          node .cal17-browser.mjs
          CODE=$?
          set -e
          kill $PID 2>/dev/null || true
          rm -f .cal17-browser.mjs .server.log
          exit $CODE
