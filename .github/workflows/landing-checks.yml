name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  actions: read
  contents: read
jobs:
  # Focused Draft diagnostics are covered by Admin World; retain normal final/main gates.
  head-exact:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || !contains(github.event.pull_request.body, '<!-- admin-world-focused-verification -->') }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      area: ${{ steps.scope.outputs.area }}
      tests: ${{ steps.scope.outputs.tests }}
      reuse: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified source HEAD: $EXPECTED_SHA"
      - name: Discover test ownership before expensive checks
        run: node tools/ci-discovery.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify fast-safe changes
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            node tools/ci-opt-01-impact.mjs >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Final review or main: mandatory full regression suite."
          fi
      - name: Upload CI diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fa-ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Reuse completed exact-head FULL evidence
        id: reuse
        uses: actions/github-script@v7
        with:
          script: |
            if(context.payload.pull_request?.head.repo.full_name!==context.repo.owner+'/'+context.repo.repo)return;
            const {findReusable}=require('./tools/ci-full-evidence.cjs');
            const run=await findReusable({github,...context.repo,sha:context.payload.pull_request?.head.sha||context.sha,workflow:'landing-checks.yml',currentRun:context.runId,prNumber:context.payload.pull_request.number,baseSha:context.payload.pull_request.base.sha});
            core.setOutput('run_id',run||'');
            if(run)await core.summary.addRaw('Reused completed FULL evidence on identical HEAD: '+process.env.GITHUB_SERVER_URL+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+run).write();


  landing:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || !contains(github.event.pull_request.body, '<!-- admin-world-focused-verification -->') }}
    runs-on: ubuntu-latest
    needs: head-exact
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && needs.head-exact.outputs.mode != 'full' && format('pr-{0}-{1}', github.event.pull_request.number, needs.head-exact.outputs.mode) || format('main-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && needs.head-exact.outputs.mode != 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified source SHA: $EXPECTED_SHA"
      - name: Discover test ownership before expensive checks
        run: node tools/ci-discovery.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        if: ${{ !needs.head-exact.outputs.reuse }}
        run: |
          node --check assets/admin-settings.js
          node --check assets/authoritative-season.mjs
          node --check assets/authoritative-calendar.mjs
          node --check assets/authoritative-history.mjs
          node --check assets/competition-tabs.js
          node --check assets/calendar-simplified.js
          node --check assets/world-calendar.js
          node --check assets/landing.js
          node --check assets/app.js
          node --check assets/app-search.js
          node --check assets/competition-page.js
          node --check assets/competition-fixtures.js
          node --check tools/validate-division-assets.mjs
      - name: Site contracts (full)
        if: ${{ (needs.head-exact.outputs.mode == 'full') && !needs.head-exact.outputs.reuse }}
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}"...HEAD -- tools/ci-opt-01-node-review.json | grep -q .; then
            node tools/ci-run.mjs 1-landing-checks -- node tools/ci-opt-01-node-runner.mjs --benchmark
          fi
          node tools/ci-run.mjs 2-landing-checks -- node tools/ci-opt-01-node-runner.mjs
      - name: Site essential contracts (FAST and TARGETED)
        if: ${{ (needs.head-exact.outputs.mode != 'full') && !needs.head-exact.outputs.reuse }}
        env:
          TARGETED_TESTS: ${{ needs.head-exact.outputs.tests }}
        run: |
          node tools/ci-run.mjs 3-landing-checks -- node tools/ci-selected.mjs
      - name: FULL coverage completed
        if: needs.head-exact.outputs.mode == 'full'
        run: echo 'All Site FULL source checks completed on exact HEAD.'
      - name: Upload CI diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fa-ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
