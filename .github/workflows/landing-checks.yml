name: Site checks
on:
  push:
    branches: [feat/landing-static, feat/world-guide-atlas]
  pull_request:
    paths: [index.html, guide/index.html, assets/landing.css, assets/landing.js, assets/guide.css, assets/guide.js, tests/landing.test.mjs, tests/guide.test.mjs, .github/workflows/landing-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check assets/landing.js
          node --check assets/guide.js
      - name: Run site contracts
        run: node --test tests/*.test.mjs
