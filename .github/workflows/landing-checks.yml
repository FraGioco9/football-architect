name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  head-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified source HEAD: $EXPECTED_SHA"
  landing:
    runs-on: ubuntu-latest
    needs: head-exact
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert integration checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified integration SHA: $EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check assets/landing.js
          node --check assets/app.js
          node --check assets/app-search.js
          node --check assets/competition-page.js
          node --check assets/competition-fixtures.js
          node --check tools/validate-division-assets.mjs
      - name: Classify fast-safe changes
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            node tools/ci-opt-01-impact.mjs >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Final review or main: mandatory full regression suite."
          fi
      - name: Site contracts (full)
        if: steps.scope.outputs.mode == 'full'
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Site essential contracts (FAST and TARGETED)
        if: steps.scope.outputs.mode != 'full'
        run: |
          node --test --test-concurrency=1 tests/ci-fast-scope.test.mjs tests/ci-opt-01-impact.test.mjs tests/ci-opt-01-node-inventory.test.mjs tests/provider-contract.test.mjs tests/static-provider.test.mjs tests/dev-fictional-provider.test.mjs tests/verified-history-provider.test.mjs tests/provider-selectors.test.mjs tests/publication-gate.test.mjs tests/arch-clean-02-security.test.mjs
      - name: Targeted area contracts
        if: steps.scope.outputs.mode == 'targeted'
        env:
          TARGETED_TESTS: ${{ steps.scope.outputs.tests }}
        run: |
          test -n "$TARGETED_TESTS"
          read -ra TEST_FILES <<< "$TARGETED_TESTS"
          node --test --test-concurrency=1 "${TEST_FILES[@]}"
