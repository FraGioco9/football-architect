name: Landing checks
on:
  push:
    branches: [feat/landing-static]
  pull_request:
    paths: [index.html, assets/landing.css, assets/landing.js, favicon.ico, favicon.svg, README.md, tests/landing.test.mjs, .github/workflows/landing-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: node --check assets/landing.js
      - name: Landing contracts
        run: node --test tests/landing.test.mjs
