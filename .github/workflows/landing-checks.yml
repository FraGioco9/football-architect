name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  head-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified source HEAD: $EXPECTED_SHA"
  landing:
    runs-on: ubuntu-latest
    needs: head-exact
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert integration checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified integration SHA: $EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check assets/landing.js
          node --check assets/app.js
          node --check assets/app-search.js
          node --check assets/competition-page.js
          node --check assets/competition-fixtures.js
          node --check tools/validate-division-assets.mjs
      - name: Site contracts
        env:
          FA_CLUB_QA_DIR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 254 && format('{0}/nav01-screenshots', runner.temp) || '' }}
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Upload NAV-01 Chromium screenshots
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 254 }}
        uses: actions/upload-artifact@v4
        with:
          name: nav01-chromium-screenshots
          path: ${{ runner.temp }}/nav01-screenshots/nav01-*.png
          if-no-files-found: error
          retention-days: 7
