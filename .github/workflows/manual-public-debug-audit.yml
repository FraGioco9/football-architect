name: Manual public Debug offline audit

# Manual only. No hosting credentials or external side effects.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved 40-character main commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-debug-offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate dispatch source and exact main SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          [[ "${GITHUB_ACTOR,,}" == "fragioco9" ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert checked-out SHA and scanner availability
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          test -f tools/audit-public-debug-artifact.mjs
          node --check tools/audit-public-debug-artifact.mjs
      - name: Run offline inventory and exposure scanner
        env:
          G10_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/g10-public-02-report.json"
          scanner_status=0
          node tools/audit-public-debug-artifact.mjs > "$report" || scanner_status=$?
          REPORT_PATH="$report" SCANNER_STATUS="$scanner_status" node --input-type=module -e '
            import {existsSync,readFileSync} from "node:fs";
            const path=process.env.REPORT_PATH;
            if(!existsSync(path)){
              console.log(JSON.stringify({audit:"HOLD",reason:"report_missing",scannerExit:Number(process.env.SCANNER_STATUS)}));
              process.exit(1);
            }
            let report;
            try{report=JSON.parse(readFileSync(path,"utf8"))}
            catch{
              console.log(JSON.stringify({audit:"HOLD",reason:"report_invalid_json",scannerExit:Number(process.env.SCANNER_STATUS)}));
              process.exit(1);
            }
            const valid=report.sourceSha===process.env.G10_EXPECTED_SHA&&
              report.fullArtifactGenerated===true&&report.artifactIntegrityChecked===true&&
              Number.isInteger(report.debugFileCount)&&Number.isInteger(report.publicFileCount)&&
              Array.isArray(report.records)&&Array.isArray(report.findings)&&
              report.findings.every(f=>f&&typeof f.rule==="string");
            if(!valid){
              console.log(JSON.stringify({audit:"HOLD",reason:"report_invalid_schema",scannerExit:Number(process.env.SCANNER_STATUS)}));
              process.exit(1);
            }
            const categories={};
            for(const finding of report.findings)
              categories[finding.rule]=(categories[finding.rule]||0)+1;
            console.log(JSON.stringify({audit:"HOLD",sourceSha:report.sourceSha,
              scannerExit:Number(process.env.SCANNER_STATUS),
              debugFileCount:report.debugFileCount,publicFileCount:report.publicFileCount,
              findings:report.findings.length,categories}));
            if(Number(process.env.SCANNER_STATUS)!==0||report.findings.length>0)process.exit(1);
          '
      # Intentionally do not upload the complete file report without privacy review.
      # Failure or a clean heuristic scan never establishes G10 PASS.
