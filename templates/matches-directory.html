<section id="app-divisions" class="app-view matches-directory" aria-labelledby="md-title">
 <h1 class="app-page-title" id="md-title">Matches</h1>
 <div class="md-controls">
  <label><span data-word="season">Season</span><select id="md-season" disabled><option>—</option></select></label>
  <label><span data-word="day">Sporting day</span><select id="md-day" disabled><option>—</option></select></label>
  <button id="md-prev" disabled aria-label="Previous day">‹</button>
  <button id="md-next" disabled aria-label="Next day">›</button>
  <button id="md-current" disabled>Current day</button>
 </div>
 <div class="md-controls">
  <label><span data-word="country">Country</span><select id="md-country"><option>All</option></select></label>
  <label><span data-word="competition">Competition</span><select id="md-competition"><option>All</option></select></label>
  <label><span data-word="search">Search team</span><input type="search" id="md-q" maxlength="100"></label>
 </div>
 <p id="md-status" role="status"></p>
 <div id="md-list" aria-busy="true"><h2 aria-hidden="true"><i></i></h2>@@ROWS@@</div>
</section>
