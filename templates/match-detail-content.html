<section id="app-divisions" class="app-view app-match-page" aria-label="Match" data-match-detail data-match-load="loading">
  <svg class="app-match-logo-filter-defs" aria-hidden="true" focusable="false" width="0" height="0" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="fa-match-logo-ivory-outline" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="expanded"/>
        <feComposite in="expanded" in2="SourceAlpha" operator="out" result="outer-ring"/>
        <feFlood flood-color="#F5F1E8" result="ivory"/>
        <feComposite in="ivory" in2="outer-ring" operator="in" result="contour"/>
        <feMerge>
          <feMergeNode in="contour"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>
  <section class="app-match-scoreboard" data-scoreboard-theme="neutral" aria-label="Match scoreboard">
    <div class="app-match-score-line">
      <a class="app-match-team-link app-match-team-home" data-match-home-name><span class="app-skeleton-bar" aria-hidden="true"></span></a>
      <strong class="app-match-side-score" data-match-home-score aria-label="Home score">—</strong>
      <a class="app-match-competition-logo" data-match-competition-link aria-label="Competition">
        <span data-match-competition-logo aria-hidden="true"></span>
      </a>
      <strong class="app-match-side-score" data-match-away-score aria-label="Away score">—</strong>
      <a class="app-match-team-link app-match-team-away" data-match-away-name><span class="app-skeleton-bar" aria-hidden="true"></span></a>
    </div>
  </section>
  <div class="app-match-scoreboard-meta">
    <span class="app-match-status" data-match-status role="status">Loading match…</span>
    <span class="app-match-extra" data-match-extra></span>
  </div>
  <p class="app-match-feedback" data-match-feedback role="status" aria-live="polite" hidden></p>
</section>
