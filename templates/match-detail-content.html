<section id="app-divisions" class="app-view app-match-page" aria-labelledby="match-page-title" data-match-detail data-match-load="loading">
  <header class="app-match-page-heading">
    <h1 id="match-page-title" class="app-page-title" data-match-label="match">Match</h1>
    <span class="app-match-reference" data-match-reference aria-live="off">#—</span>
  </header>
  <section class="app-match-scoreboard" data-scoreboard-theme="neutral" aria-label="Match scoreboard">
    <div class="app-match-scoreboard-topline" aria-hidden="true"></div>
    <header class="app-match-competition-header">
      <span class="app-match-competition-logo" data-match-competition-logo aria-hidden="true"></span>
      <span class="app-match-competition-lockup">
        <a class="app-match-competition" data-match-competition aria-label="Competition"><span class="app-skeleton-bar" aria-hidden="true"></span></a>
        <span class="app-match-context"><span data-match-stage>—</span><span aria-hidden="true">·</span><span data-match-day>—</span></span>
      </span>
    </header>
    <div class="app-match-score-line">
      <div class="app-match-team">
        <div class="app-match-crest-slot" data-match-home-crest aria-hidden="true"><span class="app-match-crest-skeleton"></span></div>
        <a class="app-match-team-link" data-match-home-name><span class="app-skeleton-bar" aria-hidden="true"></span></a>
      </div>
      <div class="app-match-score-block">
        <strong class="app-match-score" data-match-score aria-live="polite">— : —</strong>
        <span class="app-match-status" data-match-status role="status">Loading match…</span>
        <span class="app-match-extra" data-match-extra></span>
      </div>
      <div class="app-match-team">
        <div class="app-match-crest-slot" data-match-away-crest aria-hidden="true"><span class="app-match-crest-skeleton"></span></div>
        <a class="app-match-team-link" data-match-away-name><span class="app-skeleton-bar" aria-hidden="true"></span></a>
      </div>
    </div>
  </section>
  <p class="app-match-feedback" data-match-feedback role="status" aria-live="polite" hidden></p>
</section>
