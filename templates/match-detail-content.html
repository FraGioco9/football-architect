<section id="app-divisions" class="app-view app-match-page" aria-label="Match" data-match-detail data-match-load="loading">
  <section class="app-match-scoreboard" data-scoreboard-theme="neutral" aria-label="Match scoreboard">
    <div class="app-match-score-line">
      <a class="app-match-competition-logo" data-match-competition-link aria-label="Competition" target="_blank" rel="noopener noreferrer">
        <span data-match-competition-logo aria-hidden="true"></span>
      </a>
      <div class="app-match-team-slot app-match-team-home"><a class="app-match-team-link" data-match-home-name target="_blank" rel="noopener noreferrer"><span class="app-skeleton-bar" aria-hidden="true"></span></a></div>
      <strong class="app-match-side-score" data-match-home-score aria-label="Home score" aria-hidden="true"></strong>
      <span class="app-match-score-separator" aria-hidden="true">–</span>
      <strong class="app-match-side-score" data-match-away-score aria-label="Away score" aria-hidden="true"></strong>
      <div class="app-match-team-slot app-match-team-away"><a class="app-match-team-link" data-match-away-name target="_blank" rel="noopener noreferrer"><span class="app-skeleton-bar" aria-hidden="true"></span></a></div>
    </div>
  </section>
  <section class="app-match-stage" aria-label="Teams and match field">
  <aside class="app-match-side app-match-side-home" data-match-side="home" aria-label="Home team">
    <header class="app-match-team-identity">
      <span class="app-world-club-crest-placeholder club-crest fa-crest-loading app-match-team-crest" data-match-side-crest="home" aria-hidden="true"></span>
      <h2 class="app-match-side-title" data-match-side-title="home"><a class="app-match-side-link" data-match-side-name="home"></a></h2>
    </header>
    <div class="app-match-side-stats" data-form-visible="false">
    <div class="app-match-side-fact">
      <span class="app-match-side-label" data-match-label="position">Position</span>
      <strong class="app-match-position" data-match-position="home">–</strong>
    </div>
    <div class="app-match-side-fact" data-match-form-fact="home" hidden>
      <span class="app-match-side-label" data-match-label="form">Form</span>
      <div class="app-match-form" data-match-form="home" aria-label="Home form in this competition"></div>
    </div>
    </div>
    <div class="app-match-side-lineup" data-match-lineup="home">
      <h3 class="app-match-side-label" data-match-label="lineup">Lineup</h3>
      <ol class="app-match-lineup-rows" aria-hidden="true">
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
      </ol>
    </div>
  </aside>
  <section class="app-match-visual" aria-label="Match visualization">
    <div class="app-match-pitch-frame">
    <div class="app-match-pitch-overlay">
    <header class="app-match-view-header">
      <span class="app-match-view-heading" data-match-label="view">View</span>
      <div class="app-match-view-selector" role="tablist" aria-label="Match information views" data-match-view-selector>
        <button type="button" id="fa-match-tab-overview" class="app-match-view-tab" role="tab" data-match-view="overview" aria-selected="true" aria-controls="fa-match-panel-overview" tabindex="0">Overview</button>
        <button type="button" id="fa-match-tab-stats" class="app-match-view-tab" role="tab" data-match-view="stats" aria-selected="false" aria-controls="fa-match-panel-stats" tabindex="-1">Stats</button>
        <button type="button" id="fa-match-tab-events" class="app-match-view-tab" role="tab" data-match-view="events" aria-selected="false" aria-controls="fa-match-panel-events" tabindex="-1">Events</button>
      </div>
    </header>
    <div class="app-match-view-content">
      <section id="fa-match-panel-overview" role="tabpanel" data-match-view-content="overview" aria-labelledby="fa-match-tab-overview" tabindex="0">
        <div class="app-match-overview-boxes">
          <div class="app-match-info-box"><span class="app-match-info-label" data-match-label="competition">Competition</span><strong class="app-match-info-value" data-match-overview="competition"></strong></div>
          <div class="app-match-info-box"><span class="app-match-info-label" data-match-label="season">Season</span><strong class="app-match-info-value" data-match-overview="season"></strong></div>
          <div class="app-match-info-box"><span class="app-match-info-label" data-match-label="round">Round</span><strong class="app-match-info-value" data-match-overview="round"></strong></div>
        </div>
      </section>
      <section id="fa-match-panel-stats" role="tabpanel" data-match-view-content="stats" aria-labelledby="fa-match-tab-stats" tabindex="0" hidden>
        <div class="app-match-info-box app-match-info-unavailable" data-match-empty="stats">Official match statistics are not yet available.</div>
      </section>
      <section id="fa-match-panel-events" role="tabpanel" data-match-view-content="events" aria-labelledby="fa-match-tab-events" tabindex="0" hidden>
        <div class="app-match-info-box app-match-info-unavailable" data-match-empty="events">Official match events are not yet available.</div>
      </section>
    </div>
    </div>
    <div class="app-match-pitch" data-match-pitch role="img" aria-label="Empty football pitch; match visualization is not yet available">
      <svg viewBox="0 0 1050 680" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
        <rect x="18" y="18" width="1014" height="644" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M525 18V662 M18 138H183V542H18 M1032 138H867V542H1032 M18 248H73V432H18 M1032 248H977V432H1032" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="525" cy="340" r="91.5" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="525" cy="340" r="3" fill="currentColor"/>
        <circle cx="128" cy="340" r="3" fill="currentColor"/>
        <circle cx="922" cy="340" r="3" fill="currentColor"/>
        <path d="M183 267A91.5 91.5 0 0 1 183 413 M867 267A91.5 91.5 0 0 0 867 413" fill="none" stroke="currentColor" stroke-width="3"/>
      </svg>
    </div>
    </div>
  </section>
  <aside class="app-match-side app-match-side-away" data-match-side="away" aria-label="Away team">
    <header class="app-match-team-identity">
      <span class="app-world-club-crest-placeholder club-crest fa-crest-loading app-match-team-crest" data-match-side-crest="away" aria-hidden="true"></span>
      <h2 class="app-match-side-title" data-match-side-title="away"><a class="app-match-side-link" data-match-side-name="away"></a></h2>
    </header>
    <div class="app-match-side-stats" data-form-visible="false">
    <div class="app-match-side-fact">
      <span class="app-match-side-label" data-match-label="position">Position</span>
      <strong class="app-match-position" data-match-position="away">–</strong>
    </div>
    <div class="app-match-side-fact" data-match-form-fact="away" hidden>
      <span class="app-match-side-label" data-match-label="form">Form</span>
      <div class="app-match-form" data-match-form="away" aria-label="Away form in this competition"></div>
    </div>
    </div>
    <div class="app-match-side-lineup" data-match-lineup="away">
      <h3 class="app-match-side-label" data-match-label="lineup">Lineup</h3>
      <ol class="app-match-lineup-rows" aria-hidden="true">
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
        <li class="app-match-lineup-row" aria-hidden="true"><span class="app-match-lineup-reserved"></span></li>
      </ol>
    </div>
  </aside>
  </section>
  <p class="app-match-feedback" data-match-feedback role="status" aria-live="polite" hidden></p>
</section>
