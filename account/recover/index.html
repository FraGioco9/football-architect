<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Football Architect — Password recovery</title><script src="/assets/account-ui.js"></script><script src="/assets/theme.js"></script><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/landing.css"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/account.css"><script src="/assets/competition-tabs.js" defer></script>

<script src="/assets/account-recovery.js" defer></script><meta name="robots" content="noindex,nofollow"></head>
<body class="account-body"><header class="account-header"><a class="account-brand" data-account-home href="/dashboard" aria-label="Football Architect"><img class="brand-image brand-image-wide" src="/assets/brand/horizontal-dark.svg" width="512" height="156" alt="Football Architect"><img class="brand-image brand-image-symbol" src="/assets/brand/symbol-dark.svg" width="44" height="44" alt="Football Architect"></a><label class="account-language" for="account-language"><span id="account-language-label">Language</span><div class="language-control" data-account-select-control><select id="account-language" data-account-select hidden aria-hidden="true" tabindex="-1"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option></select><button type="button" class="language-trigger" id="account-language-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="account-language-menu" aria-labelledby="account-language-label account-language-value"><span id="account-language-value">English</span><svg class="language-chevron" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m5 7 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="language-menu" id="account-language-menu" role="listbox" aria-labelledby="account-language-label" hidden></div></div></label></header><main class="app-panel"><h1 id="heading">Recover your password</h1>
<form method="post" id="request-form"><label><span id="email-label">Email</span><input type="email" name="email" autocomplete="email" required maxlength="254"></label><button class="cta cta-primary" type="submit" id="request-button">Send recovery email</button></form>
<form method="post" id="complete-form" hidden><div class="account-field"><label for="account-newPassword"><span id="password-label">New password</span></label><div class="account-password"><input type="password" name="newPassword" autocomplete="new-password" required minlength="15" maxlength="128" aria-describedby="account-newPassword-help" id="account-newPassword"><button type="button" class="account-password-toggle" data-password-toggle aria-controls="account-newPassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path data-password-slash d="m4 4 16 16" hidden/></svg></button></div><small id="account-newPassword-help" data-password-help data-met="false">At least 15 characters.</small></div><button class="cta cta-primary" type="submit" id="complete-button">Reset password</button></form>
<p id="message" role="status" aria-live="polite"></p><p id="account-next-step" hidden></p><p><a href="/account/login/" id="signin-link">Back to sign in</a></p></main><footer class="account-footer">Football Architect</footer></body></html>
