<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Football Architect — Register</title>
<link rel="stylesheet" href="/assets/admin-settings.css"><style>main{max-width:34rem;margin:4rem auto;padding:1.5rem}form{display:grid;gap:1rem}label{display:grid;gap:.4rem}input{font:inherit;padding:.75rem;width:100%;box-sizing:border-box}button{font:inherit;padding:.8rem}p[role=status]{min-height:1.8em}</style>
<script src="/assets/account-onboarding.js" defer></script><meta name="robots" content="noindex,nofollow"></head><body><main><a href="/">Football Architect</a><h1 id="title">Create an account</h1>
