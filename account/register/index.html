<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Football Architect — Register</title>
<script src="/assets/account-ui.js"></script><script src="/assets/theme.js"></script><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/landing.css"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/account.css"><script src="/assets/competition-tabs.js" defer></script>
<script src="/assets/account-onboarding.js" defer></script><meta name="robots" content="noindex,nofollow"></head><body class="account-body"><header class="account-header"><a class="account-brand" data-account-home href="/dashboard" aria-label="Football Architect"><img class="brand-image brand-image-wide" src="/assets/brand/horizontal-dark.svg" width="512" height="156" alt="Football Architect"><img class="brand-image brand-image-symbol" src="/assets/brand/symbol-dark.svg" width="44" height="44" alt="Football Architect"></a><label class="account-language" for="account-language"><span id="account-language-label">Language</span><div class="language-control" data-account-select-control><select id="account-language" data-account-select hidden aria-hidden="true" tabindex="-1"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option></select><button type="button" class="language-trigger" id="account-language-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="account-language-menu" aria-labelledby="account-language-label account-language-value"><span id="account-language-value">English</span><svg class="language-chevron" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m5 7 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="language-menu" id="account-language-menu" role="listbox" aria-labelledby="account-language-label" hidden></div></div></label></header><main class="app-panel"><h1 id="title">Create an account</h1>
<form method="post" id="register-form"><label><span id="username-label">Username</span><input name="username" type="text" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" aria-describedby="username-help"><small id="username-help">3–24 letters, numbers or underscores. Your username is unique.</small></label><label><span id="email-label">Email</span><input name="email" type="email" autocomplete="email" maxlength="254" required></label>
<div class="account-field"><label for="account-password"><span id="password-label">Password</span></label><div class="account-password"><input name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required aria-describedby="account-password-help" id="account-password"><button type="button" class="account-password-toggle" data-password-toggle aria-controls="account-password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path data-password-slash d="m4 4 16 16" hidden/></svg></button></div><small id="account-password-help" data-password-help data-met="false">At least 15 characters.</small></div>
<fieldset class="account-optional"><legend id="optional-title">Optional information</legend><label><span id="nationality-label">Nationality (optional)</span><div class="language-control" data-account-select-control><select name="nationality" id="nationality" data-account-select hidden aria-hidden="true" tabindex="-1"><option value="">Not specified</option></select><button type="button" class="language-trigger" id="nationality-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="nationality-menu" aria-labelledby="nationality-label nationality-value"><span id="nationality-value">Not specified</span><svg class="language-chevron" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m5 7 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="language-menu account-country-menu" id="nationality-popover" hidden><label class="account-country-search"><span id="nationality-search-label">Search countries</span><input type="search" id="nationality-search" data-menu-search autocomplete="off" aria-controls="nationality-menu" aria-describedby="nationality-empty"></label><div id="nationality-menu" role="listbox" aria-labelledby="nationality-label"></div><p id="nationality-empty" data-menu-empty hidden role="status">No countries found.</p></div></div></label><label><span id="city-label">City (optional)</span><input name="city" type="text" autocomplete="address-level2" maxlength="200"></label></fieldset><button class="cta cta-primary" type="submit" id="submit">Register</button></form><p role="status" id="status" aria-live="polite"></p><p id="account-next-step" hidden></p><p><a id="login-link" href="/account/login/">Sign in</a></p></main><footer class="account-footer">Football Architect</footer></body></html>
