<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Football Architect — Register</title>
<script src="/assets/account-ui.js"></script><script src="/assets/theme.js"></script><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/landing.css"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/account.css"><script src="/assets/competition-tabs.js" defer></script>
<script src="/assets/account-onboarding.js" defer></script><meta name="robots" content="noindex,nofollow"></head><body class="account-body"><header class="account-header"><a class="account-brand" data-account-home href="/dashboard" aria-label="Football Architect"><img class="brand-image brand-image-wide" src="/assets/brand/horizontal-dark.svg" width="512" height="156" alt="Football Architect"><img class="brand-image brand-image-symbol" src="/assets/brand/symbol-dark.svg" width="44" height="44" alt="Football Architect"></a><label class="account-language" for="account-language"><span id="account-language-label">Language</span><select id="account-language" data-account-select><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option></select></label></header><main class="app-panel"><h1 id="title">Create an account</h1>
<form method="post" id="register-form"><label><span id="username-label">Username</span><input name="username" type="text" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" aria-describedby="username-help"><small id="username-help">3–24 letters, numbers or underscores. Your username is unique.</small></label><label><span id="email-label">Email</span><input name="email" type="email" autocomplete="email" maxlength="254" required></label>
<label><span id="password-label">Password</span><input name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required></label>
<label><span id="nationality-label">Nationality (optional)</span><select name="nationality" id="nationality" data-account-select><option value="">Not specified</option></select></label><label><span id="city-label">City (optional)</span><input name="city" type="text" autocomplete="address-level2" maxlength="200"></label><button class="cta cta-primary" type="submit" id="submit">Register</button></form><p role="status" id="status" aria-live="polite"></p><p><a id="login-link" href="/account/login/">Sign in</a></p></main><footer class="account-footer">Football Architect</footer></body></html>
