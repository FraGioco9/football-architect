<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Football Architect — Account login</title>
<script src="/assets/account-ui.js"></script><script src="/assets/theme.js"></script><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/landing.css"><link rel="stylesheet" href="/assets/account.css">

<script src="/assets/account-login.js" defer></script><meta name="robots" content="noindex,nofollow"></head>
<body class="account-body"><header class="account-header"><a class="account-brand" data-account-home href="/" aria-label="Football Architect"><img class="brand-image brand-image-wide" src="/assets/brand/horizontal-dark.svg" width="512" height="156" alt="Football Architect"><img class="brand-image brand-image-symbol" src="/assets/brand/symbol-dark.svg" width="44" height="44" alt="Football Architect"></a><label class="account-language" for="account-language"><span id="account-language-label">Language</span><select id="account-language"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option></select></label></header><main><h1 id="heading">Sign in</h1>
<form method="post" id="account-login" autocomplete="on"><label><span id="email-label">Email</span><input name="email" type="email" autocomplete="username" required maxlength="254"></label>
<label><span id="password-label">Password</span><input name="password" type="password" autocomplete="current-password" required minlength="15" maxlength="128"></label>
<button type="submit" id="submit">Sign in</button></form><p><a href="/account/recover/" id="recovery-link">Forgot your password?</a></p><p><a href="/account/register/" id="register-link">Create an account</a></p><p id="message" role="status" aria-live="polite"></p></main><footer class="account-footer">Football Architect</footer></body></html>
