# Local-only development configuration. The reserved UUID below identifies local persistence, not a provisioned remote database. No deploy script or secret.
name = "fa-admin-world-local"
main = "src/index.ts"
compatibility_date = "2026-10-26"

[dev]
ip = "127.0.0.1"
port = 8787

[vars]
PLAYER_MODE = "local"
PLAYER_ORIGIN = "http://app.localhost:2000"
# Explicit opt-in; this config is local-only and cannot send real mail.
PLAYER_LOCAL_INBOX_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "fa-admin-world-local"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"
